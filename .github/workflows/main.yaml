name: Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pandas 2 (the lock) and pandas 3 must build and load the same containers
          - python: "3.10"
            pandas: ""
          - python: "3.12"
            pandas: "pandas>=3,<4"
    name: test (Python ${{ matrix.python }}${{ matrix.pandas && ', pandas 3' || ', pandas 2' }})
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: |
          uv sync --extra tests --python ${{ matrix.python }}
          if [ -n "${{ matrix.pandas }}" ]; then uv pip install "${{ matrix.pandas }}"; fi

      - name: Run tests
        run: uv run --no-sync pytest tests/

      - name: Lint v2 dataset definitions
        run: |
          uvx ruff@0.15.15 check datasets/_dev/tabarena-v0pt2/*/dataset.py datasets/_template/dataset.py
          uvx ruff@0.15.15 format --check datasets/_dev/tabarena-v0pt2/*/dataset.py datasets/_template/dataset.py
