name: Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --extra tests

      - name: Run tests
        run: uv run pytest tests/

      - name: Lint v2 dataset definitions
        run: |
          uvx ruff@0.15.15 check datasets/_dev/tabarena-v0pt2/*/dataset.py datasets/_template/v2/dataset.py
          uvx ruff@0.15.15 format --check datasets/_dev/tabarena-v0pt2/*/dataset.py datasets/_template/v2/dataset.py
