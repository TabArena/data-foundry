# Editable dropdown vocabularies for curation records.
#
# Each key is a record field; the list is the set of allowed dropdown values.
# Add new options here (or via the dashboard) — this file is git-tracked, so
# changes are reviewable and apply globally. Records may still carry a value
# not listed here; the importer/validator flags those via `needs_review`.
#
# Initial order is by frequency in the original Google Sheet at migration time.

