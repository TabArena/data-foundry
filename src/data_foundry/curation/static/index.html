<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Foundry — Curation</title>
<link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator_simple.min.css" rel="stylesheet" />
<script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<style>
  :root { --bg:#f7f7f8; --bar:#202b3b; --accent:#2d6cdf; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:#1c2433; }
  #bar { background:linear-gradient(90deg,#1b2738,#26374f); color:#fff; padding:9px 16px; display:flex; align-items:center; gap:16px; }
  #bar .brand { display:flex; align-items:center; gap:10px; }
  #bar .brand .logo { background:#3b6fe0; color:#fff; font-weight:800; font-size:13px; border-radius:7px; padding:5px 7px; letter-spacing:.5px; }
  #bar .brand .t { font-weight:700; font-size:15px; }
  #bar .brand .s { font-size:10.5px; opacity:.6; margin-top:-1px; text-transform:uppercase; letter-spacing:.06em; }
  #bar .guide-btn { color:#fff; text-decoration:none; font-size:13px; border:1px solid #ffffff2e; background:#ffffff12; padding:6px 11px; border-radius:8px; white-space:nowrap; }
  #bar .guide-btn:hover { border-color:#ffffff70; }
  #bar .search-wrap { flex:1; max-width:520px; }
  #bar .search-wrap input { width:100%; padding:7px 11px; border:1px solid #ffffff26; border-radius:8px; background:#ffffff14; color:#fff; font-size:13px; }
  #bar .search-wrap input::placeholder { color:#ffffff80; }
  #bar .hint { font-size:11px; opacity:.55; white-space:nowrap; }
  /* status filter menu (opened from the leftmost column header) */
  /* status-column header: an obvious "filter by status" button (funnel) next to the sort area */
  .stmenu { display:inline-flex; align-items:center; justify-content:center; width:26px; height:22px;
    border:1px solid #c2cbd6; border-radius:6px; background:#eef2f7; color:#374151; cursor:pointer;
    box-shadow:0 1px 1px rgba(0,0,0,.04); }
  .stmenu:hover { background:#dbe7fb; border-color:#7ea2dd; color:#1e3a8a; }
  .stmenu svg { width:15px; height:15px; fill:currentColor; pointer-events:none; }
  #statusMenu { position:fixed; display:none; background:#fff; border:1px solid #d6dbe2; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:130; padding:5px; min-width:210px; }
  #statusMenu.show { display:block; }
  #statusMenu .smi { display:flex; align-items:center; gap:9px; padding:6px 9px; border-radius:6px; cursor:pointer; font-size:13px; color:#27313f; }
  #statusMenu .smi:hover { background:#eef4ff; }
  #statusMenu .smi.active { background:#e0e7ff; font-weight:600; }
  #statusMenu .smk { width:22px; height:20px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none; }
  /* compact filter pills: a colored count badge + short label, wrap-friendly so more
     toggles can be added without crowding the bar. Active state fills with the pill color. */
  #bar .pills { margin-left:auto; display:flex; flex-wrap:wrap; gap:5px; justify-content:flex-end; align-items:center; }
  .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid #ffffff2e; background:#ffffff12; color:#fff; border-radius:7px; padding:3px 8px; cursor:pointer; transition:background .12s,border-color .12s; line-height:1; }
  .pill .n { font-size:11.5px; font-weight:800; background:#ffffff2b; border-radius:5px; padding:1px 5px; min-width:14px; text-align:center; }
  .pill .l { font-size:11px; opacity:.9; white-space:nowrap; }
  .pill:hover { border-color:#ffffff70; }
  .pill.df.active { background:#15803d; border-color:#22c55e; }
  .pill.tab.active { background:#1d4ed8; border-color:#3b82f6; }
  .pill.bey.active { background:#0f766e; border-color:#14b8a6; }
  .pill.rev.active { background:#b91c1c; border-color:#ef4444; }
  /* disagreement: always purple-filled so it stands out as a flag */
  .pill.dis { background:#7c3aed; border-color:#a78bfa; }
  .pill.dis:hover { border-color:#ede9fe; }
  .pill.dis.active { background:#6d28d9; box-shadow:0 0 0 2px rgba(167,139,250,.5); }
  #toast { position:fixed; bottom:14px; right:14px; background:#143; color:#fff; padding:8px 12px; border-radius:6px;
           opacity:0; transition:opacity .25s; pointer-events:none; z-index:120; }
  #toast.err { background:#922; }
  #toast.show { opacity:.97; }
  .chip { display:inline-block; border-radius:10px; padding:1px 8px; margin:1px 2px; font-size:11px; white-space:nowrap; }
  .opt-sw { display:inline-block; width:11px; height:11px; border-radius:3px; border:1px solid; margin-right:7px; vertical-align:-1px; }
  .tabulator-edit-list-item.active { background:#2d6cdf !important; color:#fff !important; font-weight:600; }
  /* obvious "add option" button in dropdown headers */
  .addopt { cursor:pointer; display:inline-block; color:#fff; background:#3b6fe0; font-weight:800;
            font-size:13px; line-height:17px; min-width:18px; height:18px; text-align:center; padding:0 4px;
            border-radius:5px; margin-left:5px; box-shadow:0 1px 2px rgba(0,0,0,.2); vertical-align:middle; }
  .addopt:hover { background:#234fb0; transform:translateY(-1px); }
  .more-cell { cursor:pointer; }
  .more-empty { color:#aaadb5; font-style:italic; }
  a.src { color:var(--accent); text-decoration:none; }
  /* table polish: light header, zebra rows, thin borders, generous padding */
  .tabulator { border:1px solid #e2e6ec; background:#fff; }
  .tabulator .tabulator-header { background:#eef1f5; border-bottom:1px solid #d6dbe2; }
  .tabulator .tabulator-header .tabulator-col { background:transparent; border-right:1px solid #e1e5eb; }
  .tabulator .tabulator-header .tabulator-col .tabulator-col-title { font-weight:600; color:#39424f; white-space:normal; line-height:1.2; }
  /* dropdown affordance: a faint ▾ that appears on cell hover (empty cells still look empty) */
  .tabulator-cell.dd-cell { position:relative; }
  .tabulator-cell.dd-cell::after { content:"▾"; position:absolute; right:5px; top:50%; transform:translateY(-50%); color:#98a2b3; font-size:11px; opacity:0; transition:opacity .12s; pointer-events:none; }
  .tabulator-cell.dd-cell:hover::after { opacity:.85; }
  .tabulator-row { background:#fff; border-bottom:1px solid #eef1f4; }
  .tabulator-row.r-even { background:#f6f8fb; }
  .tabulator-row:hover { background:#eaf1ff; }
  /* non-frozen cells are transparent (show row bg); frozen cells use the theme's
     background-color:inherit, so they pick up zebra + hover from the row automatically. */
  .tabulator-cell { white-space:pre-wrap; background-color:transparent; border-right:1px solid #eef1f4; padding:5px 9px; color:#27313f; }
  .st { font-weight:800; font-size:13px; line-height:1; }
  .pin { cursor:pointer; opacity:.2; transition:opacity .12s; }
  .tabulator-row:hover .pin { opacity:.55; }
  .pin.on { opacity:1; }
  .tabulator-row.pinned .tabulator-cell.pincol { box-shadow: inset 3px 0 0 #f59e0b; }
  .tabulator-cell.single-line { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tabulator-cell.wrap-cell { white-space:normal !important; height:auto; line-height:1.7; }
  /* modal */
  #overlay { position:fixed; inset:0; background:rgba(20,26,38,.45); display:none; z-index:100; }
  #overlay.show { display:block; }
  #modal { position:absolute; top:0; right:0; height:100%; width:520px; max-width:92vw; background:#fff;
           box-shadow:-4px 0 18px rgba(0,0,0,.2); display:flex; flex-direction:column; }
  #modal header { padding:12px 16px; background:var(--bar); color:#fff; display:flex; justify-content:space-between; align-items:center; }
  #modal header .sub { font-size:12px; opacity:.8; }
  #modal .body { padding:12px 16px; overflow:auto; }
  #modal .field { margin-bottom:16px; }
  #modal .field h4 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#555; }
  #modal .opts { display:flex; flex-wrap:wrap; gap:4px; }
  .opt { cursor:pointer; border-radius:11px; padding:2px 9px; font-size:12px; border:2px solid transparent; opacity:.55; user-select:none; }
  .opt.sel { opacity:1; border-color:#33415580; font-weight:600; }
  .addrow { margin-top:6px; display:flex; gap:5px; }
  .addrow input { flex:1; padding:4px 7px; border:1px solid #ccd; border-radius:5px; font-size:12px; }
  .addrow button { border:0; background:#e6edff; color:#23408e; border-radius:5px; padding:3px 9px; cursor:pointer; font-size:12px; }
  #modal button.close { background:transparent; color:#fff; border:0; font-size:20px; cursor:pointer; }
  /* dropdown / list popups (cell editors + header-filter selects): keep them above
     everything and scrollable, so a long option list is never clipped off-screen or
     hidden behind frozen columns. */
  .tabulator-edit-list, .tabulator-edit-select-list {
    z-index: 10050 !important;
    max-height: 50vh; overflow-y: auto;
    box-shadow: 0 10px 28px rgba(0,0,0,.24);
    border:1px solid #cfd6df; border-radius:8px; background:#fff;
  }
  /* active-filter cues: highlight any column whose header filter is set and the
     global search box, so it is obvious data is being filtered (not "missing"). */
  .tabulator .tabulator-col { position:relative; }
  .tabulator .tabulator-col.hf-active { background:#fff3d6 !important; }
  .tabulator .tabulator-col.hf-active .tabulator-col-title { color:#9a3412; }
  .tabulator .tabulator-col.hf-active::after {
    content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:#f59e0b; z-index:2;
  }
  #bar .search-wrap input.active { background:#ffffff26; box-shadow:0 0 0 2px #f59e0b inset; }
  #clearFilters { display:none; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;
    border:1px solid #f59e0b; background:#f59e0b26; color:#ffe6b0; border-radius:8px; padding:6px 11px; font-size:12px; }
  #clearFilters.show { display:inline-flex; }
  #clearFilters:hover { background:#f59e0b40; }
  #count.filtered { color:#fbbf24; font-weight:700; }
  /* ⓘ next to the shown-count: the record count under-counts the datasets actually examined
     (a record can cite several source links); the tooltip gives a rough total. */
  .info-hint { cursor:help; opacity:.6; margin-left:4px; font-size:13px; user-select:none; }
  .info-hint:hover { opacity:1; }
  /* thin divider grouping the collection pills from the workflow-flag pills */
  .pill-sep { width:1px; align-self:stretch; margin:2px 3px; background:#ffffff33; }
  /* compact verify action: a small ✓ icon next to the pin, shown only on AI-reviewed (🤖) rows */
  .vmark { cursor:pointer; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
           border-radius:5px; background:#0891b2; color:#fff; font-size:12px; font-weight:800; line-height:1;
           border:1px solid #0e7490; box-shadow:0 1px 2px rgba(0,0,0,.18); }
  .vmark:hover { background:#0e7490; transform:translateY(-1px); }
  /* verify confirmation dialog (pick name + read-and-agree gate, replaces the top-bar selector) */
  .voverlay { position:fixed; inset:0; background:rgba(20,26,38,.5); display:none; z-index:140; align-items:center; justify-content:center; }
  .voverlay.show { display:flex; }
  .vdialog { background:#fff; border-radius:12px; width:430px; max-width:92vw; box-shadow:0 16px 48px rgba(0,0,0,.3); padding:18px 20px; }
  .vdialog h3 { margin:0 0 2px; font-size:16px; color:#15303f; }
  .vdialog .vsub { font-size:12px; color:#6b7686; margin-bottom:12px; word-break:break-all; }
  .vdialog .vrow { margin:10px 0; font-size:13px; color:#27313f; }
  .vdialog .vrow.sugg { background:#ecfeff; border:1px solid #a5f3fc; color:#155e75; border-radius:8px; padding:7px 10px; }
  .vdialog select { font-size:13px; padding:4px 7px; border:1px solid #ccd; border-radius:6px; }
  .vagree { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:#3a3a3a; background:#fff7ed;
            border:1px solid #fed7aa; border-radius:8px; padding:9px 11px; cursor:pointer; }
  .vagree input { margin-top:2px; }
  .vactions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .vactions button { border:0; border-radius:7px; padding:7px 14px; font-size:13px; cursor:pointer; }
  #vCancel { background:#eef1f5; color:#333; }
  #vConfirm { background:#0891b2; color:#fff; font-weight:700; }
  #vConfirm:disabled { opacity:.45; cursor:not-allowed; }
  /* leftmost status column: now click-to-sort (▾ still opens the filter menu) */
  .tabulator .tabulator-col[tabulator-field="_status"]:not(.hf-active) { cursor:pointer; }
</style>
</head>
<body>
<div id="bar">
  <div class="brand"><span class="logo">DF</span><div><div class="t">Data Foundry</div><div class="s">curation log</div></div></div>
  <a class="guide-btn" href="guidelines.html" target="_blank" rel="noopener" title="Read the curation guidelines / tutorial">📖 Guidelines</a>
  <div class="search-wrap"><input type="text" id="search" placeholder="Search name, comments, links, tags…" /></div>
  <span class="hint" id="count"></span><span class="info-hint" id="countInfo" title="">&#9432;</span>
  <span id="clearFilters" title="Clear search, status filter, pills, and all column filters">✕ Clear filters</span>
  <div class="pills">
    <button class="pill df" id="pillDf" title="Filter: datasets in Data Foundry"><span class="n" id="dfN">0</span><span class="l">Data Foundry</span></button>
    <button class="pill tab" id="pillTab" title="Filter: datasets shipped in TabArena v0.1"><span class="n" id="tabN">0</span><span class="l">TabArena v0.1</span></button>
    <button class="pill bey" id="pillBey" title="Filter: datasets shipped in BeyondArena"><span class="n" id="beyN">0</span><span class="l">BeyondArena</span></button>
    <span class="pill-sep"></span>
    <button class="pill rev" id="pillRev" title="Filter: datasets to review — untriaged (⚠) plus AI-reviewed but unverified (🤖). Use the status funnel to see one group at a time."><span class="n" id="revN">0</span><span class="l">Review</span></button>
    <button class="pill dis" id="pillDis" title="Filter: open disagreements — unresolved ones, plus shipped-but-disputed (Yes (Disagreement)) to re-evaluate"><span class="n" id="disN">0</span><span class="l">⚡ Disagreement</span></button>
  </div>
</div>
<div id="grid"></div>
<div id="toast"></div>
<div id="statusMenu"></div>

<div id="overlay">
  <div id="modal">
    <header>
      <div><div id="m-title"></div><div class="sub" id="m-sub"></div></div>
      <button class="close" id="m-close" title="Close">×</button>
    </header>
    <div class="body" id="m-body"></div>
  </div>
</div>

<div id="verifyOverlay" class="voverlay">
  <div class="vdialog">
    <h3>Verify dataset</h3>
    <div class="vsub" id="vName"></div>
    <div class="vrow sugg" id="vSugg"></div>
    <div class="vrow">Reviewer: <select id="vCurator"></select></div>
    <label class="vagree"><input type="checkbox" id="vAgree" />
      <span>I carefully read this dataset's info (comments, links, AI assessment) and confirm this decision.
      This removes the &ldquo;AI&nbsp;(UNVERIFIED)&rdquo; flag and records me as the reviewer.</span></label>
    <div class="vactions">
      <button id="vCancel" type="button">Cancel</button>
      <button id="vConfirm" type="button" disabled>✓ Verify</button>
    </div>
  </div>
</div>

<script>
// ----------------------------------------------------------------------------
// Mode. The same page powers the live local dashboard (read/write against the
// Python server) and the public, read-only static build for GitHub Pages. The
// static build injects `window.DF_STATIC = true` ahead of this script; in that
// mode the two reads come from sibling JSON files and every write path / editing
// affordance is dropped (view, search, sort, filter, pin still work entirely
// client-side).
const STATIC = !!window.DF_STATIC;
const SCHEMA_URL = STATIC ? "./schema.json" : "/api/schema";
const RECORDS_URL = STATIC ? "./records.json" : "/api/records";

// ----------------------------------------------------------------------------
// Layout config — tweak freely.
const PRIMARY = [
  "checked_by", "unique_name", "data_foundry_status", "suggestion", "decision_markers", "tags",
  "name", "source_links", "comments", "year", "domain", "reference",
];
const EXTRA = ["original_source", "collections", "required_split", "problem_type", "original_data_state"];
const HIDDEN = new Set(["data_modality", "usable_task_type", "given_task_type"]);
const FROZEN = new Set(["_status", "checked_by", "unique_name"]);
const YEARS = Array.from({ length: 2027 - 1950 + 1 }, (_, i) => String(2027 - i));  // recent first; also free-text

// ----------------------------------------------------------------------------
// Colors. Each option gets a deterministic color from its text; a few fields
// are coloured semantically instead (good=green, bad=red, warn=amber, neutral=grey).
const SEM = {
  good: { bg: "#d6f5dd", fg: "#14692f" },
  bad:  { bg: "#ffd7d7", fg: "#911c1c" },
  warn: { bg: "#fde68a", fg: "#7d5310" },
  pink: { bg: "#fbcfe8", fg: "#9d174d" },
  neutral: { bg: "#e4e4ea", fg: "#4a4a55" },
};
// Prominent, fixed colors for the most important New Tag values (stand out vs. the auto palette).
const CUSTOM = {
  // The merged "Data Foundry" field mixes integration-status tags (DF: …, coloured
  // semantically below) with benchmark-collection membership (coloured here so the two
  // kinds of value are visually distinct in the same cell).
  data_foundry_status: {
    "TabArena (v0.1)": { bg: "#1e3a8a", fg: "#ffffff" },  // dark blue
    "BeyondArena":     { bg: "#0e7490", fg: "#ffffff" },  // teal
  },
  tags: {
    "Non-IID (Temporal)": { bg: "#f9a8d4", fg: "#831843" },             // rose
    "Non-IID (Grouped)":  { bg: "#d8b4fe", fg: "#5b21b6" },             // lila
    "New IID":            { bg: "#86efac", fg: "#14532d" },             // green
    "Larger IID Data":    { bg: "#1e3a8a", fg: "#ffffff" },             // dark blue
    "2nd Tier / Scientfic Discovery": { bg: "#fde047", fg: "#713f12" }, // yellow
    "?":                  { bg: "#fdba74", fg: "#9a3412" },             // yellow/red (alert)
  },
};
const SEMANTIC = {
  data_foundry_status: { "DF: Yes": "good", "DF: Suspended": "warn", "DF: WIP": "warn", "DF: Much work": "warn" },
  suggestion: { "Yes": "good", "Yes (Disagreement)": "warn", "No": "bad", "TBD -> Yes": "warn", "TBD -> 2nd Tier": "warn", "Disagreement": "bad" },
  decision_markers: {
    // bad / disqualifying -> red
    "Wrong Domain / Source Modality": "bad", "AHDS (Artifical/Handmade/Deterministic/Simulated)": "bad",
    "Duplicate": "bad", "Missing source information": "bad", "Outdated": "bad", "Data Quality Issue": "bad",
    "Trivial": "bad", "Ethical Issue": "bad", "Too Small": "bad", "Not Representative": "bad",
    "Not Available (from Paper))": "bad", "Out-of-scope Task (CTR/RecSys/Ranking)": "bad",
    "No Good Target (yet)": "bad", "No Good Target  / Scientific Discovery": "bad",
    // in progress / fixable -> amber
    "Needs extensive data wrangling": "warn", "TBD": "warn",
    // requested -> pink
    "Data Requested": "pink",
    // descriptive / neutral -> grey
    "Time-series (Classification)": "neutral", "Time-series (Forecasting)": "neutral",
    "Time-series (Regression)": "neutral", "Image": "neutral", "NLP (Text)": "neutral", "Robotics (RL)": "neutral",
  },
};
const PEOPLE_COLORED = new Set(["Lennart", "Andrej"]);  // everyone else in checked_by -> grey
function hashHue(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 360; }
// Distinct hue per option spread by the golden angle, so options within a field never collide.
function autoColor(field, value) {
  const list = VOCAB[field] || [];
  const i = list.indexOf(value);
  const hue = Math.round((i >= 0 ? i * 137.508 : hashHue(String(value))) % 360);
  return { bg: `hsl(${hue} 65% 89%)`, fg: `hsl(${hue} 55% 30%)` };
}
function colorFor(field, value) {
  if (CUSTOM[field] && CUSTOM[field][value]) return CUSTOM[field][value];
  if (field === "checked_by" && !PEOPLE_COLORED.has(value)) return SEM.neutral;
  const sem = SEMANTIC[field] && SEMANTIC[field][value];
  if (sem) return SEM[sem];
  return autoColor(field, value);
}
function chipHtml(field, value) {
  const c = colorFor(field, value);
  return `<span class="chip" style="background:${c.bg};color:${c.fg}">${escapeHtml(value)}</span>`;
}
// Colors each option inside the inline list-editor popup with its chip color.
// Per-cell editor params: reads the cell's current value so already-selected
// options are marked (✓ + bold) in the popup, each with its color swatch.
function listEditorParams(field, multi) {
  return (cell) => {
    const selected = new Set(asArray(cell.getValue()));
    return {
      values: VOCAB[field] || [], multiselect: multi, allowEmpty: true,
      itemFormatter: (label, value) => {
        const c = colorFor(field, value);
        const sw = `<span class="opt-sw" style="background:${c.bg};border-color:${c.fg}"></span>`;
        const sel = selected.has(value);
        return `${sw}${sel ? "✓ " : ""}<span${sel ? ' style="font-weight:700"' : ""}>${escapeHtml(label)}</span>`;
      },
    };
  };
}

// Params for a column's header-filter dropdown (pick one vocabulary value to filter by).
function listFilterParams(field) {
  return { values: VOCAB[field] || [], clearable: true, autocomplete: true, listOnEmpty: true };
}

// ----------------------------------------------------------------------------
let SCHEMA, VOCAB, BY_NAME, table;
const LINK_FIELDS = new Set();

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function asArray(v) { return Array.isArray(v) ? v : (v ? [v] : []); }
function splitLines(v) { return String(v || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean); }
function toast(msg, err = false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = err ? "err" : "", 1600);
}

// formatters
function multiChips(field) { return cell => (cell.getValue() || []).map(v => chipHtml(field, v)).join(""); }
function selectChip(field) { return cell => { const v = cell.getValue(); return v ? chipHtml(field, v) : ""; }; }
function linksFmt(cell) {
  return splitLines(cell.getValue()).map(u =>
    /^https?:\/\//.test(u) ? `<a class="src" href="${escapeHtml(u)}" target="_blank" rel="noopener">${escapeHtml(u)}</a>` : escapeHtml(u)
  ).join("<br>");
}
// Single source of truth for a row's status marker + color (first match wins).
// 🤖 (AI-reviewed, unverified) ranks above a plain Yes/No: the AI's verdict is
// provisional, so a human must still verify it — that takes precedence over showing
// the (AI-supplied) suggestion as if it were settled.
function rowStatus(d) {
  const sugg = d.suggestion, df = d.data_foundry_status || [], rev = (d.needs_review || []);
  if (sugg === "Disagreement" || sugg === "Yes (Disagreement)")
    return { m: "⚡", bg: "#7c3aed", fg: "#fff",
             t: sugg === "Yes (Disagreement)" ? "Shipped, but with an open disagreement — to re-evaluate" : "Disagreement — needs resolution" };
  if (df.includes("DF: Yes"))  return { m: "✓", bg: "#16a34a", fg: "#fff", t: "In Data Foundry" };
  if (rev.includes("ai_unverified"))
    return { m: "🤖", bg: "#0891b2", fg: "#fff",
             t: "AI-reviewed (UNVERIFIED) — a human must verify" + (sugg ? " · AI suggests: " + sugg : "") };
  if (sugg === "No")           return { m: "✗", bg: "#dc2626", fg: "#fff", t: "Suggestion: No" };
  if (sugg === "Yes")          return { m: "★", bg: "#2563eb", fg: "#fff", t: "Accepted — not yet in Data Foundry" };
  if (rev.length)              return { m: "⚠", bg: "#f97316", fg: "#fff", t: "Needs review: " + rev.join(", ") };
  return { m: "•", bg: "#facc15", fg: "#6b4e00", t: "Pending / other" };
}
function statusFmt(cell) {
  const st = rowStatus(cell.getRow().getData());
  const el = cell.getElement();
  el.style.background = st.bg; el.style.color = st.fg; el.title = st.t;
  return `<span class="st">${st.m}</span>`;
}
// Pinned rows stay visible through any filter/search (session-scoped).
const pinned = new Set();
function pinFmt(cell) {
  const id = cell.getRow().getData().unique_name;
  return `<span class="pin${pinned.has(id) ? " on" : ""}" title="Pin this row to keep it visible through filters">📌</span>`;
}
function togglePin(row) {
  const id = row.getData().unique_name;
  if (pinned.has(id)) { pinned.delete(id); try { row.unfreeze(); } catch (e) { /* not frozen */ } }
  else { pinned.add(id); try { row.freeze(); } catch (e) { /* freeze unsupported */ } }
  row.reformat();
  applyFilters();
}

// Status filter menu, opened by clicking the leftmost column header.

  { m: "", label: "All datasets", bg: "#e4e4ea", fg: "#444" },
  { m: "⚡", label: "Disagreement", bg: "#7c3aed", fg: "#fff" },
  { m: "🤖", label: "AI-reviewed (verify)", bg: "#0891b2", fg: "#fff" },
  { m: "✓", label: "In Data Foundry", bg: "#16a34a", fg: "#fff" },
  { m: "✗", label: "Suggestion: No", bg: "#dc2626", fg: "#fff" },
  { m: "★", label: "Accepted (not in DF)", bg: "#2563eb", fg: "#fff" },

let fStatus = "";
function buildStatusMenu() {
  const menu = document.getElementById("statusMenu");
  menu.innerHTML = "";
  // Sort-by-status entry (groups disagreements / in-DF / rejected together).
  const sortItem = document.createElement("div");
  sortItem.className = "smi";
  sortItem.innerHTML = `<span class="smk" style="background:#334155;color:#fff">↕</span>Sort rows by status`;
  sortItem.addEventListener("click", () => { table.setSort("_status", "asc"); menu.classList.remove("show"); });

    item.addEventListener("click", () => {

// Sort order for the leftmost status column: action-needed states first, rejected
// last (Tabulator reverses this for the descending click).
const STATUS_RANK = ["⚡", "🤖", "⚠", "★", "•", "✓", "✗"];
function statusSorter(_a, _b, aRow, bRow) {
  return STATUS_RANK.indexOf(rowStatus(aRow.getData()).m) - STATUS_RANK.indexOf(rowStatus(bRow.getData()).m);
}
// Status header: the column itself sorts (headerSort); the ▾ opens the filter menu
// without triggering a sort (stopPropagation).
function statusTitleFormatter() {
  const wrap = document.createElement("span");
  // funnel icon = "filter by status"; sits beside Tabulator's sort arrow on the header.
  wrap.innerHTML = '<span class="stmenu" title="Filter by status">'
    + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 .78 1.63L15 14.2V19a1 1 0 0 1-1.45.9l-3-1.5A1 1 0 0 1 10 17.5v-3.3L2.22 6.63A1 1 0 0 1 3 5z"/></svg>'
    + '</span>';
  wrap.querySelector(".stmenu").addEventListener("click", e => { e.stopPropagation(); openStatusMenu(e); });

}
function moreFmt(cell) {
  const d = cell.getRow().getData();
  const html = EXTRA.flatMap(f => asArray(d[f]).map(v => chipHtml(f, v))).join("");
  return html || `<span class="more-empty">＋ tags…</span>`;
}

function toRow(rec) { const r = { ...rec }; for (const f of LINK_FIELDS) r[f] = (rec[f] || []).join("\n"); return r; }

// ----------------------------------------------------------------------------
// ---- AI-review verify workflow ---------------------------------------------
// A compact ✓ on AI-reviewed (🤖) rows opens a confirm dialog: pick your name + affirm you
// read the info, then it stamps you, drops AI (UNVERIFIED) + the AI-Filled tag, and the server
// recomputes needs_review (the row leaves the Review queue).
function verifyFmt(cell) {
  const d = cell.getRow().getData();
  if (!(d.needs_review || []).includes("ai_unverified")) return "";
  return `<span class="vmark" title="Verify this AI-reviewed dataset (opens a confirm dialog)">✓</span>`;
}
let verifyId = null;
function lastCurator() { return localStorage.getItem("df_curator") || ""; }
function fillCuratorSelect(sel, selected) {
  const people = (VOCAB.checked_by || []).filter(p => p !== "AI (UNVERIFIED)");
  sel.innerHTML = '<option value="">— select your name —</option>'
    + people.map(p => `<option${p === selected ? " selected" : ""}>${escapeHtml(p)}</option>`).join("");
}
function syncVConfirm() {
  const ok = document.getElementById("vCurator").value && document.getElementById("vAgree").checked;
  document.getElementById("vConfirm").disabled = !ok;
}
// Open the confirm dialog for an AI-reviewed row.
function openVerifyDialog(row) {
  const d = row.getData();
  if (!(d.needs_review || []).includes("ai_unverified")) return;
  verifyId = d.unique_name;
  document.getElementById("vName").textContent = d.unique_name + (d.name && d.name !== d.unique_name ? " — " + d.name : "");
  document.getElementById("vSugg").textContent =
    `Decision to record: ${d.suggestion || "(none)"} — edit the suggestion cell first if you disagree, then verify.`;
  fillCuratorSelect(document.getElementById("vCurator"), lastCurator());
  document.getElementById("vAgree").checked = false;
  syncVConfirm();
  document.getElementById("verifyOverlay").classList.add("show");
}
function closeVerifyDialog() { document.getElementById("verifyOverlay").classList.remove("show"); verifyId = null; }
// Confirm: drop AI (UNVERIFIED) + the AI-Filled tag, stamp the chosen reviewer. The server
// recomputes needs_review, so the row leaves the Review queue. (Edit the suggestion first to disagree.)
async function confirmVerify() {
  if (!verifyId) return;
  const me = document.getElementById("vCurator").value;
  if (!me || !document.getElementById("vAgree").checked) return;
  const row = table.getRow(verifyId);
  const d = row.getData();
  const checked_by = (d.checked_by || []).filter(x => x !== "AI (UNVERIFIED)");
  if (!checked_by.includes(me)) checked_by.push(me);
  const tags = (d.tags || []).filter(x => x !== "AI-Filled (Verify)");
  try {
    const updated = await putRecord(verifyId, { checked_by, tags });
    row.update({ checked_by, tags, needs_review: updated.needs_review });
    row.reformat();
    localStorage.setItem("df_curator", me);
    updateCount(); applyFilters();
    toast(`Verified by ${me} — ${d.suggestion || "no suggestion"}`);
    closeVerifyDialog();
  } catch (e) { toast("Verify failed: " + e.message, true); }
}

async function putRecord(id, patch) {
  const res = await fetch("/api/records/" + encodeURIComponent(id), {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
async function registerNew(vocabKey, values) {
  if (!vocabKey) return;
  const known = new Set(VOCAB[vocabKey] || []);
  for (const v of values) {
    if (v && !known.has(v)) {
      const out = await (await fetch("/api/vocab", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ field: vocabKey, value: v }),
      })).json();
      if (out.values) VOCAB[vocabKey] = out.values;  // editor params read VOCAB live on open
    }
  }
}

// Header title with a "＋" to add a new option to this dropdown's vocabulary.
function addBtnTitle(label, field) {
  return () => {
    const wrap = document.createElement("span");
    wrap.innerHTML = `${escapeHtml(label)} <span class="addopt" title="Add a new option to this dropdown">＋</span>`;
    wrap.querySelector(".addopt").addEventListener("click", async ev => {
      ev.stopPropagation();
      const v = (prompt(`New option for “${label}”:`) || "").trim();
      if (v) { await registerNew(field, [v]); toast(`Added option “${v}”`); }
    });
    return wrap;
  };
}

function columnDefs() {
  const cols = [
    { title: "", field: "_pin", frozen: true, width: 30, headerSort: false, headerFilter: false, download: false, hozAlign: "center", cssClass: "pincol", formatter: pinFmt, cellClick: (e, cell) => togglePin(cell.getRow()), headerTooltip: "Pin rows to keep them visible through any filter" },
    { title: "", field: "_status", frozen: true, width: 64, headerSort: true, sorter: statusSorter, headerFilter: false, download: false, hozAlign: "center", formatter: statusFmt, headerTooltip: "Click the column to sort by status · click the funnel to filter by status", titleFormatter: statusTitleFormatter },
  ];
  // Compact "verify" action (live build only): a ✓ icon next to the pin on AI-reviewed (🤖)
  // rows opens the confirm dialog (pick name + read-and-agree) — no space-hungry column.
  if (!STATIC) cols.splice(1, 0, {
    title: "", field: "_verify", frozen: true, width: 30, headerSort: false, headerFilter: false,
    download: false, hozAlign: "center", cssClass: "verifycol", formatter: verifyFmt,
    cellClick: (e, cell) => { if (e.target.closest(".vmark")) openVerifyDialog(cell.getRow()); },
    headerTooltip: "Verify an AI-reviewed (🤖) row",
  });
  for (const name of PRIMARY) {
    if (name === "unique_name") {
      cols.push({ title: "unique_name", field: "unique_name", frozen: true, width: 180, editor: false, headerFilter: "input" });
      continue;
    }
    const f = BY_NAME[name];
    const c = { title: f.label, field: name, headerTooltip: f.help, resizable: true, headerFilter: "input", width: 150 };
    if (FROZEN.has(name)) c.frozen = true;
    if (f.kind === "text") {
      if (name === "year") {
        c.editor = "list"; c.width = 92; c.cssClass = "dd-cell";
        c.editorParams = { values: YEARS, autocomplete: true, freetext: true, allowEmpty: true, listOnEmpty: true };
      } else {
        c.editor = "input"; if (name === "name") c.width = 200;
      }
    }
    else if (f.kind === "select") {
      c.editor = "list"; c.cssClass = "dd-cell"; c.titleFormatter = addBtnTitle(f.label, name);
      c.editorParams = listEditorParams(name, false);
      c.formatter = selectChip(name);
      // pick a value from the dropdown to filter to rows with exactly that value
      // (pinned rows stay visible through column filters too)
      c.headerFilter = "list"; c.headerFilterParams = listFilterParams(name);
      c.headerFilterFunc = (sel, rowVal, data) => pinned.has(data.unique_name) || rowVal === sel;
    }
    else if (f.kind === "multiselect") {
      c.editor = "list"; c.titleFormatter = addBtnTitle(f.label, name);
      c.editorParams = listEditorParams(name, true);
      c.formatter = multiChips(name); c.width = 190; c.variableHeight = true; c.cssClass = "wrap-cell dd-cell";
      // pick a value from the dropdown to filter to all rows that carry that value
      // (pinned rows stay visible through column filters too)
      c.headerFilter = "list"; c.headerFilterParams = listFilterParams(name);
      c.headerFilterFunc = (sel, _rowVal, data) => pinned.has(data.unique_name) || asArray(data[name]).includes(sel);
    }
    else if (f.kind === "links") { c.editor = "textarea"; c.editorParams = { shiftEnterSubmit: true }; c.formatter = linksFmt; c.width = 240; c.variableHeight = true; }
    else if (f.kind === "body") {
      c.editor = "textarea"; c.editorParams = { shiftEnterSubmit: true };
      if (name === "comments") { c.width = 340; c.variableHeight = true; c.formatter = "textarea"; }
      else { c.width = 200; c.cssClass = "single-line"; c.tooltip = true; c.formatter = cell => escapeHtml(String(cell.getValue() || "")); }
    }
    if (name === "data_foundry_status") c.width = 170;  // multiselect: DF state + benchmark tags
    cols.push(c);
  }
  cols.push({
    title: "Optional Tags", field: "_more", headerSort: false, headerFilter: false, download: false, width: 280, variableHeight: true,
    headerTooltip: "Original source, source benchmark/collection, required split, problem type, data state — click to edit.",
    cssClass: "more-cell wrap-cell", formatter: moreFmt, cellClick: (e, cell) => openModal(cell.getRow().getData().unique_name),
  });
  // Read-only build: strip every editing affordance from editable columns, but
  // leave the view-only columns (pin, status filter, "more" modal) untouched.
  if (STATIC) {
    for (const c of cols) {
      if (!c.editor) continue;
      c.editor = false;
      delete c.editorParams;
      delete c.titleFormatter;  // removes the "＋ add option" header button
      if (c.cssClass) c.cssClass = c.cssClass.replace(/\bdd-cell\b/g, "").trim() || undefined;
    }
  }
  return cols;
}

async function onEdit(cell) {
  const f = cell.getField();
  const spec = BY_NAME[f];
  if (!spec) return;
  let value = cell.getValue();
  if (spec.kind === "links") value = splitLines(value);
  else if (spec.kind === "multiselect") value = asArray(value);
  else if (value === "") value = null;
  try {
    await registerNew(spec.vocab, asArray(value));
    const updated = await putRecord(cell.getRow().getData().unique_name, { [f]: value });
    cell.getRow().update({ needs_review: updated.needs_review });
    cell.getRow().reformat();
    updateCount();
    toast("Saved");
  } catch (e) { toast("Save failed: " + e.message, true); cell.restoreOldValue(); }
}

function closeModal() { document.getElementById("overlay").classList.remove("show"); modalId = null; }
function renderModalBody() {
  const d = table.getRow(modalId).getData();
  const body = document.getElementById("m-body");
  body.innerHTML = "";
  if (STATIC) {  // read-only: show the selected values as chips, no toggles / add-row

          <input type="text" placeholder="add new option…" id="add-${field}" onkeydown="if(event.key==='Enter')addExtraOption('${field}')" />
          <button onclick="addExtraOption('${field}')">+ add</button>

async function toggleExtra(field, optionValue) {
  const spec = BY_NAME[field];
  const row = table.getRow(modalId);
  const cur = asArray(row.getData()[field]);
  let value;
  if (spec.kind === "multiselect") {
    const set = new Set(cur);
    set.has(optionValue) ? set.delete(optionValue) : set.add(optionValue);
    value = [...set];
  } else {
    value = cur[0] === optionValue ? null : optionValue;
  }
  try {
    const updated = await putRecord(modalId, { [field]: value });
    row.update({ [field]: value, needs_review: updated.needs_review });
    row.reformat();
    renderModalBody();
    updateCount();
    toast("Saved");
  } catch (e) { toast("Save failed: " + e.message, true); }
}
async function addExtraOption(field) {
  const input = document.getElementById("add-" + field);
  const v = input.value.trim();
  if (!v) return;
  await registerNew(BY_NAME[field].vocab, [v]);
  input.value = "";
  await toggleExtra(field, v);  // re-renders modal with the new option selected
}
window.toggleExtra = toggleExtra;
window.addExtraOption = addExtraOption;

// ---- filters ---------------------------------------------------------------
// Each pill is an exclusive view with a row-test and a header count element.
// DF / TabArena / BeyondArena all read the merged `data_foundry_status` field (and work
// in the read-only static build too); rev/dis are live-only workflow states. The Data
// Foundry pill counts collection membership (TabArena ∪ BeyondArena) — the datasets
// actually shipped — not every record carrying a "DF: …" integration tag.
const inBenchmark = d => (d.data_foundry_status || []).some(v => v === "TabArena (v0.1)" || v === "BeyondArena");
const PILLS = {
  df:  { active: false, el: "pillDf",  count: "dfN",  test: inBenchmark },
  tab: { active: false, el: "pillTab", count: "tabN", test: d => (d.data_foundry_status || []).includes("TabArena (v0.1)") },
  bey: { active: false, el: "pillBey", count: "beyN", test: d => (d.data_foundry_status || []).includes("BeyondArena") },
  // Review = anything still needing a curator: untriaged (no suggestion), out-of-vocab
  // values, ship conflicts, and AI-reviewed-but-unverified rows (needs_review carries
  // "ai_unverified"). So the AI-review pass stays visible here until a human signs off.
  rev: { active: false, el: "pillRev", count: "revN", test: d => (d.needs_review || []).length > 0 },
  dis: { active: false, el: "pillDis", count: "disN", test: d => d.suggestion === "Disagreement" || d.suggestion === "Yes (Disagreement)" },
};
function anyPill() { return Object.values(PILLS).some(p => p.active); }
function applyFilters() {
  const term = document.getElementById("search").value.trim().toLowerCase();
  table.setFilter(d => {
    if (pinned.has(d.unique_name)) return true;  // pinned rows never vanish
    if (term) {
      // A search always spans ALL datasets, ignoring the active pill/status filters.
      const hay = Object.values(d)
        .map(v => (Array.isArray(v) ? v.join(" ") : v == null ? "" : v))
        .join(" ").toLowerCase();
      return hay.includes(term);
    }
    if (fStatus && rowStatus(d).m !== fStatus) return false;
    for (const p of Object.values(PILLS)) if (p.active && !p.test(d)) return false;
    return true;
  });
}
function syncPillClasses() {
  for (const p of Object.values(PILLS)) document.getElementById(p.el).classList.toggle("active", p.active);
}
// Clear every filter (search box, status menu, all pills) — pins are untouched.
function resetAllFilters() {
  for (const p of Object.values(PILLS)) p.active = false;
  fStatus = "";
  document.getElementById("search").value = "";
  syncPillClasses();
}
// `activeRows` is the filtered row set Tabulator hands to the `dataFiltered` event.
// Prefer it: `getDataCount("active")` is stale when read synchronously inside that
// handler (it lags one filter behind), which made the "N / M shown" indicator wrong.
function updateCount(activeRows) {
  const all = table.getData();
  for (const p of Object.values(PILLS)) document.getElementById(p.count).textContent = all.filter(p.test).length;
  const active = Array.isArray(activeRows) ? activeRows.length : table.getDataCount("active");
  document.getElementById("count").textContent = `${active} / ${table.getDataCount()} shown`;
  markActiveFilters(active);
}
// Highlight every active filter (column header dropdowns + global search) and show the
// "Clear filters" button, so it is always obvious when the view is being filtered.
function markActiveFilters(active) {
  let activeFields = new Set();
  try { activeFields = new Set((table.getHeaderFilters() || []).map(f => f.field)); } catch (e) { /* pre-build */ }
  table.getColumns().forEach(col => {
    const el = col.getElement();
    // also flag the leftmost status column when a status filter is active (it is not a
    // Tabulator header filter, so it would otherwise show no active-cue)
    const on = activeFields.has(col.getField()) || (col.getField() === "_status" && !!fStatus);
    if (el) el.classList.toggle("hf-active", on);
  });
  const search = document.getElementById("search");
  const hasSearch = !!search.value.trim();
  search.classList.toggle("active", hasSearch);
  const any = activeFields.size > 0 || hasSearch || anyPill() || !!fStatus;
  document.getElementById("clearFilters").classList.toggle("show", any);
  const cnt = document.getElementById("count");
  const activeCount = (active == null) ? table.getDataCount("active") : active;
  cnt.classList.toggle("filtered", activeCount < table.getDataCount());
}

// The "N / M shown" count counts curation records, which under-counts the datasets actually
// examined: a record often cites several source links (versions / mirrors / related sets). Use
// the avg links-per-record × records as a rough total, surfaced via the ⓘ tooltip next to the count.
function setExaminedHint(rawRecords) {
  const total = rawRecords.length;
  const links = rawRecords.reduce((s, r) => s + ((r.source_links || []).length), 0);
  const avg = total ? links / total : 0;
  document.getElementById("countInfo").title =
    `${total} curation records — but many more datasets were examined.\n`
    + `Records cite ~${avg.toFixed(1)} source links each on average → ≈ ${links} datasets/links looked at in total `
    + `(a record often bundles several versions / sources of a dataset).`;
}

async function boot() {
  SCHEMA = await (await fetch(SCHEMA_URL)).json();
  VOCAB = SCHEMA.vocabularies;
  BY_NAME = {};
  for (const f of SCHEMA.fields) { BY_NAME[f.name] = f; if (f.kind === "links") LINK_FIELDS.add(f.name); }
  const raw = await (await fetch(RECORDS_URL)).json();
  setExaminedHint(raw);
  const recs = raw.map(toRow);
  const cols = columnDefs();

  table = new Tabulator("#grid", {
    data: recs, columns: cols, layout: "fitData", height: "calc(100vh - 46px)",
    // Keep the virtual DOM (rendering all ~1200 variable-height rows at once freezes startup),
    // with a moderate render buffer as the trade-off: large enough that normal scrolling rarely
    // shows a render gap, small enough to start fast. Buffer is px beyond the viewport (~a couple
    // of screens). Raise it for smoother scroll at the cost of startup, lower it for faster start.
    renderVerticalBuffer: 3000,
    movableColumns: true, index: "unique_name",
    initialSort: [{ column: "_status", dir: "asc" }],  // group by status on load (disagreements first)
    rowFormatter: row => {
      const p = row.getPosition(true);
      const el = row.getElement();
      el.classList.toggle("r-even", p % 2 === 0);
      el.classList.toggle("r-odd", p % 2 === 1);
      el.classList.toggle("pinned", pinned.has(row.getData().unique_name));
    },
  });
  if (!STATIC) table.on("cellEdited", onEdit);  // no write path in the read-only build
  table.on("dataFiltered", (filters, rows) => updateCount(rows));
  table.on("tableBuilt", () => { applyFilters(); updateCount(); });

  document.getElementById("search").addEventListener("input", applyFilters);
  document.getElementById("clearFilters").addEventListener("click", () => {
    try { table.clearHeaderFilter(); } catch (e) { /* none set */ }
    resetAllFilters();
    applyFilters();
  });
  document.addEventListener("click", e => {
    const m = document.getElementById("statusMenu");
    if (m.classList.contains("show") && !m.contains(e.target) && !e.target.closest(".tabulator-col")) m.classList.remove("show");
  });
  // Pills are exclusive among THEMSELVES (only one collection view at a time), but they
  // layer with the status filter — pick a pill (e.g. BeyondArena), then narrow by status.
  // Clicking an active pill turns it off. The status filter is left untouched.
  const pillToggle = key => () => {
    const was = PILLS[key].active;
    for (const p of Object.values(PILLS)) p.active = false;
    PILLS[key].active = !was;
    syncPillClasses();
    applyFilters();
  };
  for (const key of ["df", "tab", "bey"]) document.getElementById(PILLS[key].el).addEventListener("click", pillToggle(key));
  // The public build keeps the Data Foundry / collection view pills; the review /
  // disagreement workflow pills are hidden (and left unwired).
  if (STATIC) {
    document.getElementById("pillRev").style.display = "none";
    document.getElementById("pillDis").style.display = "none";
  } else {
    document.getElementById("pillRev").addEventListener("click", pillToggle("rev"));
    document.getElementById("pillDis").addEventListener("click", pillToggle("dis"));
  }
  document.getElementById("m-close").addEventListener("click", closeModal);
  document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
  // verify confirmation dialog
  document.getElementById("vCancel").addEventListener("click", closeVerifyDialog);
  document.getElementById("vConfirm").addEventListener("click", confirmVerify);
  document.getElementById("vCurator").addEventListener("change", syncVConfirm);
  document.getElementById("vAgree").addEventListener("change", syncVConfirm);
  document.getElementById("verifyOverlay").addEventListener("click", e => { if (e.target.id === "verifyOverlay") closeVerifyDialog(); });
}
boot();
</script>
</body>
</html>
