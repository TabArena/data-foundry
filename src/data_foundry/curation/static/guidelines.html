<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Foundry — Guidelines</title>
<!-- The guidelines are the markdown files of two skills (.claude/skills/knowledge-curation/ and
     .claude/skills/knowledge-data-foundry/), rendered here in the browser, so there is no second copy to
     keep in sync. The first page, "Start here", is .claude/skills/README.md (docs/start/README.md), shown
     when that file exists. Live: the dashboard server answers api/docs (manifest) and docs/<skill>/<path>.md.
     Static (GitHub Pages): build-site injects window.DF_STATIC and writes docs/manifest.json + the files. -->
<script src="https://unpkg.com/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<style>
  :root { --accent:#4f46e5; --ink:#27313f; --muted:#5b6573; --line:#e3e8ee; --bg:#f4f6f9; --head:56px; --nav:276px; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:15px/1.65 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }

  /* header: same bar as the dashboard */
  #df-top { position:sticky; top:0; z-index:30; height:var(--head); display:flex; align-items:center; gap:14px; padding:0 20px;
            background:linear-gradient(110deg,#1a1452 0%,#2b2f96 38%,#1d4ed8 100%); color:#fff;
            border-bottom:1px solid #ffffff22; box-shadow:0 4px 18px -8px rgba(37,99,235,.5); }
  #df-top .brand { display:flex; align-items:center; gap:10px; min-width:0; color:#fff; text-decoration:none; }
  #df-top .brand:hover .t { text-decoration:underline; }
  #df-top .logo { flex:none; background:linear-gradient(135deg,#7c3aed,#2563eb); font-weight:800; font-size:13px; border-radius:7px;
                  padding:5px 7px; letter-spacing:.5px; box-shadow:0 2px 6px rgba(124,58,237,.45); }
  #df-top .brand > div { min-width:0; }
  #df-top .t { font-weight:700; font-size:16px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #df-top .s { font-size:11px; line-height:1.3; opacity:.6; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap;
               overflow:hidden; text-overflow:ellipsis; }
  #df-top .back { margin-left:auto; flex:none; color:#cfe0ff; text-decoration:none; font-size:13px; border:1px solid #ffffff30;
                  padding:6px 12px; border-radius:7px; white-space:nowrap; }
  #df-top .back:hover { background:#ffffff14; }
  #df-navbtn { display:none; flex:none; font:inherit; font-size:13px; color:#fff; background:#ffffff12; border:1px solid #ffffff30;
               border-radius:7px; padding:5px 10px; cursor:pointer; }

  /* sidebar + page */
  #df-layout { display:grid; grid-template-columns:var(--nav) minmax(0,1fr); min-height:calc(100vh - var(--head)); }
  #df-nav { position:sticky; top:var(--head); align-self:start; height:calc(100vh - var(--head)); overflow-y:auto; background:#fff;
            border-right:1px solid #dfe4ea; padding:16px 12px 40px; }
  #df-search { width:100%; padding:7px 10px; border:1px solid #d6dbe2; border-radius:8px; font:inherit; font-size:13px;
               background:#f8fafc; color:var(--ink); margin-bottom:8px; }
  #df-search:focus { outline:2px solid #c7d2fe; border-color:var(--accent); background:#fff; }
  .sec { margin:8px 0 14px; }
  .sec-t { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:#7a828f; padding:6px 10px 4px; }
  a.doc { display:block; padding:5px 10px; border-radius:7px; color:#2b3543; text-decoration:none; font-size:14px; line-height:1.35; }
  a.doc:hover { background:#eef2f7; }
  a.doc.active { background:#e0e7ff; color:#312e81; font-weight:600; }
  .sub { margin:2px 0 6px 14px; border-left:2px solid #e0e7ff; }
  .sub:empty { display:none; }
  .sub a { display:block; padding:3px 10px; font-size:12.5px; line-height:1.35; color:var(--muted); text-decoration:none; }
  .sub a:hover { color:var(--accent); }
  body.filtering .sub { display:none; }
  .nomatch { color:var(--muted); font-size:13px; padding:4px 10px; margin:0; }

  #df-main { min-width:0; padding:28px 32px 80px; }
  #df-doc, #df-docfoot { max-width:880px; margin:0 auto; }
  #df-doc.loading { opacity:.45; transition:opacity .15s; }
  #df-docfoot { margin-top:36px; padding-top:12px; border-top:1px solid #e6eaef; color:#7a828f; font-size:12.5px; }
  #df-docfoot:empty { display:none; }
  #df-docfoot a { color:inherit; }

  /* rendered markdown */
  .md { overflow-wrap:break-word; }
  .md h1 { font-size:26px; line-height:1.25; margin:.2em 0 .5em; }
  .md h2 { font-size:20px; line-height:1.3; margin:1.7em 0 .5em; padding-top:.6em; border-top:1px solid #e6eaef; }
  .md > h2:first-child { border-top:0; padding-top:0; margin-top:.2em; }
  .md h3 { font-size:16px; line-height:1.35; margin:1.4em 0 .4em; color:#3730a3; }
  .md h4, .md h5, .md h6 { font-size:14.5px; margin:1.2em 0 .3em; }
  .md :is(h1,h2,h3,h4,h5,h6) { scroll-margin-top:calc(var(--head) + 14px); }
  .md :is(h1,h2,h3,h4,h5,h6).target { animation:df-flash 1.8s ease-out; border-radius:4px; }
  @keyframes df-flash { from { background:#fef3c7; } to { background:transparent; } }
  .md .anchor { margin-left:.35em; color:#a5b4fc; text-decoration:none; font-weight:400; opacity:0; transition:opacity .12s; }
  .md :is(h1,h2,h3,h4,h5,h6):hover .anchor, .md .anchor:focus { opacity:1; }
  @media (hover:none) { .md .anchor { opacity:.5; } }
  .md p, .md li { color:#2b3543; }
  .md a { color:#2d5bd8; }
  .md ul, .md ol { padding-left:24px; }
  .md li { margin:.25em 0; }
  .md li > p { margin:.3em 0; }
  .md hr { border:0; border-top:1px solid var(--line); margin:1.8em 0; }
  .md img { max-width:100%; }
  .md blockquote { margin:14px 0; padding:8px 16px; background:#eef4ff; border:1px solid #d3e1ff; border-left:4px solid #818cf8;
                   border-radius:8px; color:#2b3543; }
  .md blockquote > :first-child { margin-top:.2em; }
  .md blockquote > :last-child { margin-bottom:.2em; }
  .md blockquote .alert-t { font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; margin:.2em 0 .1em; }
  .md blockquote.alert-note .alert-t, .md blockquote.alert-tip .alert-t { color:#23408e; }
  .md blockquote.alert-important { background:#f5f3ff; border-color:#ddd6fe; border-left-color:#7c3aed; }
  .md blockquote.alert-important .alert-t { color:#5b21b6; }
  .md blockquote.alert-tip { background:#f0fdf4; border-color:#bbf7d0; border-left-color:#16a34a; }
  .md blockquote.alert-tip .alert-t { color:#166534; }
  .md blockquote.alert-warning, .md blockquote.alert-caution { background:#fff7ed; border-color:#fed7aa; border-left-color:#ea580c; }
  .md blockquote.alert-warning .alert-t, .md blockquote.alert-caution .alert-t { color:#9a3412; }
  .md code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#eef1f5; padding:1px 5px; border-radius:4px;
             font-size:.86em; }
  .md pre { background:#f6f8fa; border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-x:auto; line-height:1.5;
            font-size:13px; }
  .md pre code { background:none; padding:0; font-size:inherit; white-space:pre; }
  .md .tablewrap { overflow-x:auto; margin:16px 0; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .md table { border-collapse:collapse; width:100%; font-size:14px; line-height:1.5; }
  .md th, .md td { padding:7px 11px; border-bottom:1px solid #eef1f4; text-align:left; vertical-align:top; }
  .md th { background:#eef1f5; font-weight:600; color:#39424f; border-bottom:1px solid #d6dbe2; }
  .md tr:nth-child(even) td { background:#f9fafc; }
  .md tbody tr:last-child td { border-bottom:0; }
  .md details { margin:12px 0; padding:6px 14px; background:#fff; border:1px solid var(--line); border-radius:8px; }
  .md summary { cursor:pointer; font-weight:600; }
  .note { background:#fff7ed; border:1px solid #fed7aa; border-radius:8px; padding:10px 14px; color:#7c2d12; }

  #df-scrim { display:none; }
  @media (max-width: 860px) {
    #df-layout { grid-template-columns:minmax(0,1fr); }
    #df-navbtn { display:inline-block; }
    /* align-self back to stretch: Chrome aligns a fixed box too, and "start" would size it to its content */
    #df-nav { position:fixed; top:var(--head); left:0; bottom:0; height:auto; align-self:stretch; width:min(320px, 86vw); z-index:25;
              transform:translateX(-105%); transition:transform .18s ease; box-shadow:0 10px 30px rgba(15,23,42,.25); }
    body.nav-open #df-nav { transform:none; }
    body.nav-open #df-scrim { display:block; position:fixed; top:var(--head); left:0; right:0; bottom:0; background:rgba(15,23,42,.35);
                              z-index:20; }
    #df-main { padding:20px 16px 64px; }
    #df-top { padding:0 12px; gap:10px; }
    #df-top .s { display:none; }
    .md h1 { font-size:22px; }
  }
  @media (max-width: 520px) { #df-top .back .long, #df-top .t .pre { display:none; } }
</style>
</head>
<body>
<header id="df-top">
  <button id="df-navbtn" type="button" aria-controls="df-nav" aria-expanded="false" title="Show the list of pages">☰ Pages</button>
  <a class="brand" href="index.html" title="Back to the curation log"><span class="logo">DF</span>
    <div><div class="t"><span class="pre">Data Foundry — </span>Guidelines</div><div class="s">curation knowledge &amp; how this repo applies it</div></div></a>
  <a class="back" href="index.html">← Back<span class="long"> to curation</span></a>
</header>
<div id="df-layout">
  <nav id="df-nav" aria-label="Guideline pages">
    <input type="search" id="df-search" placeholder="Filter pages (titles and text)" aria-label="Filter pages" />
    <div id="df-toc"></div>
  </nav>
  <main id="df-main">
    <article id="df-doc" class="md"><p>Loading…</p></article>
    <footer id="df-docfoot"></footer>
  </main>
</div>
<div id="df-scrim"></div>

<script>
// <df-docs-core>
// Pure helpers, no DOM (kept in one block so they can be checked outside a browser): front matter,
// GitHub's heading slugs, the #doc=<skill>/<path>.md&h=<slug> hash, and link rewriting.
const DFDocs = (() => {
  const SKILLS_ROOT = ".claude/skills/";
  const ABSOLUTE = /^[a-z][a-z0-9+.-]*:/i;  // http:, https:, mailto:, data:, ...

  // YAML front matter at the very top (as GitHub hides it): "---" ... "---" (or "...").
  function stripFrontMatter(text) {
    return String(text).replace(/^﻿?---[ \t]*\r?\n(?:[\s\S]*?\r?\n)?(?:---|\.\.\.)[ \t]*(?:\r?\n|$)/, "");
  }

  // GitHub's heading ids (github-slugger): lowercase, drop everything but letters, marks, numbers,
  // "_", "-" and spaces, then each space becomes "-". Repeats get -1, -2, ... in document order.
  function slug(text) {
    return String(text).toLowerCase().replace(/[^\p{L}\p{M}\p{N}\p{Pc} -]/gu, "").replace(/ /g, "-");
  }
  function makeSlugger() {
    const seen = Object.create(null);
    return (text) => {
      const base = slug(text);
      let result = base;
      while (result in seen) {
        seen[base] += 1;
        result = base + "-" + seen[base];
      }
      seen[result] = 0;
      return result;
    };
  }

  const decode = (s, fn) => { try { return fn(s); } catch (e) { return s; } };

  // "#doc=knowledge-curation/references/x.md&h=some-heading". A hash without "=" (an old
  // guidelines.html#section link) is read as a heading of the default page.
  function parseHash(hash) {
    const raw = String(hash || "").replace(/^#/, "");
    const out = { doc: null, h: null };
    if (!raw) return out;
    if (!raw.includes("=")) { out.h = decode(raw, decodeURIComponent); return out; }
    for (const part of raw.split("&")) {
      const at = part.indexOf("=");
      if (at < 0) continue;
      const key = part.slice(0, at), value = decode(part.slice(at + 1), decodeURIComponent);
      if (key === "doc") out.doc = value || null;
      else if (key === "h") out.h = value || null;
    }
    return out;
  }
  function formatHash(doc, heading) {
    let hash = "#doc=" + encodeURIComponent(doc).replace(/%2F/gi, "/");
    if (heading) hash += "&h=" + encodeURIComponent(heading);
    return hash;
  }

  const dirname = (path) => (path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "");
  // Resolve a relative path against a repo-relative directory; null if it climbs above the repo root.
  function joinPath(baseDir, rel) {
    const parts = baseDir ? baseDir.split("/") : [];
    for (const seg of rel.split("/")) {
      if (seg === "" || seg === ".") continue;
      if (seg === "..") {
        if (!parts.length) return null;
        parts.pop();
      } else parts.push(seg);
    }
    return parts.join("/");
  }
  function splitHref(href) {
    let path = href, query = "", frag = "";
    const hashAt = path.indexOf("#");
    if (hashAt >= 0) { frag = path.slice(hashAt + 1); path = path.slice(0, hashAt); }
    const queryAt = path.indexOf("?");
    if (queryAt >= 0) { query = path.slice(queryAt); path = path.slice(0, queryAt); }
    return { path, query, frag };
  }
  // A repo path this page shows: a .md file inside one of the rendered skill folders -> "<skill>/<path>".
  function viewerDoc(repoPath, skills) {
    if (!repoPath.startsWith(SKILLS_ROOT) || !repoPath.endsWith(".md")) return null;
    const rest = repoPath.slice(SKILLS_ROOT.length);
    const skill = rest.split("/")[0];
    return skills.includes(skill) && rest.length > skill.length + 1 ? rest : null;
  }

  // Rewrite one link of the markdown file at repo path `from`. ctx = {blobBase, skills, page, docs}, where
  // docs (optional) is a Map of repo path -> doc id for pages outside the skill folders (Start here).
  //   absolute (scheme: or //host)                       -> unchanged
  //   a page of this viewer: .md inside a rendered skill,
  //   a path in ctx.docs, or "#heading"                  -> page + "#doc=<id>&h=<heading>"
  //   any other relative path ("/x" = repo root)          -> blobBase + "/" + repo path (+ ?query, #fragment)
  function resolveLink(href, from, ctx) {
    const raw = String(href).trim();
    if (!raw || ABSOLUTE.test(raw) || raw.startsWith("//")) return href;
    const { path, query, frag } = splitHref(raw);
    let target = from;
    if (path) {
      target = joinPath(path.startsWith("/") ? "" : dirname(from), decode(path, decodeURI));
      if (target === null) return href;
    }
    const doc = query ? null : (ctx.docs && ctx.docs.get(target)) || viewerDoc(target, ctx.skills);
    if (doc) return (ctx.page || "") + formatHash(doc, decode(frag, decodeURIComponent));
    return ctx.blobBase + "/" + encodeURI(target) + query + (frag ? "#" + frag : "");
  }
  // Images and other embedded files: the raw file on GitHub.
  function resolveAsset(src, from, ctx) {
    const raw = String(src).trim();
    if (!raw || ABSOLUTE.test(raw) || raw.startsWith("//")) return src;
    const { path } = splitHref(raw);
    const target = joinPath(path.startsWith("/") ? "" : dirname(from), decode(path, decodeURI));
    return target ? ctx.blobBase + "/" + encodeURI(target) + "?raw=true" : src;
  }

  return { stripFrontMatter, slug, makeSlugger, parseHash, formatHash, joinPath, viewerDoc, resolveLink, resolveAsset };
})();
// </df-docs-core>

(() => {
  const STATIC = !!window.DF_STATIC;
  const DEFAULT_BLOB = "https://github.com/TabArena/data-foundry/blob/main";
  const DEFAULT_SKILLS = ["knowledge-curation", "knowledge-data-foundry"];
  const START = "start";  // the Start here section (.claude/skills/README.md): a page, not a skill folder
  const $ = (id) => document.getElementById(id);
  const docEl = $("df-doc"), footEl = $("df-docfoot"), tocEl = $("df-toc"), searchEl = $("df-search"), navBtn = $("df-navbtn");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const docId = (d) => d.skill + "/" + d.path;
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";

  let manifest = { sections: [], docs: [] };
  let ctx = { blobBase: DEFAULT_BLOB, skills: DEFAULT_SKILLS, page: "", docs: new Map() };
  let byId = new Map();
  let current = null, loadSeq = 0, textsLoading = null;
  const texts = new Map();  // doc id -> markdown, for the page filter
  const blobUrl = (repoPath) => ctx.blobBase + "/" + encodeURI(repoPath);

  // markdown-it as GitHub renders: raw HTML on (the files are our own), tables on (default), bare
  // http(s) URLs linked, but no fuzzy links (prose names files like SKILL.md, and .md is a domain).
  const md = window.markdownit ? window.markdownit({ html: true, linkify: true }) : null;
  if (md) {
    md.linkify.set({ fuzzyLink: false, fuzzyEmail: false });
    md.renderer.rules.table_open = () => '<div class="tablewrap"><table>\n';
    md.renderer.rules.table_close = () => "</table></div>\n";
  }

  async function fetchJson(url) {
    const resp = await fetch(url, { cache: "no-cache" });
    if (!resp.ok) throw new Error(url + ": HTTP " + resp.status);
    return resp.json();
  }
  async function loadManifest() {
    const urls = STATIC ? ["docs/manifest.json", "api/docs"] : ["api/docs", "docs/manifest.json"];
    let error;
    for (const url of urls) {
      try { return await fetchJson(url); } catch (e) { error = e; }
    }
    throw error;
  }
  async function fetchDoc(id) {
    const resp = await fetch("docs/" + encodeURI(id), { cache: "no-cache" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const text = await resp.text();
    texts.set(id, text);
    return text;
  }

  // -- sidebar ---------------------------------------------------------------
  function buildNav() {
    const out = [];
    for (const sec of manifest.sections) {
      const docs = manifest.docs.filter((d) => d.skill === sec.skill);
      if (!docs.length) continue;
      // A section that is one page of the same name (Start here) needs no heading above it.
      const lone = docs.length === 1 && docs[0].title === sec.title;
      out.push(`<section class="sec">${lone ? "" : `<div class="sec-t">${esc(sec.title)}</div>`}`);
      for (const d of docs) {
        const id = docId(d);
        out.push(`<a class="doc" data-doc="${esc(id)}" href="${esc(DFDocs.formatHash(id))}" title="${esc(d.repo_path)}">${esc(d.title)}</a>`
          + `<div class="sub" data-sub="${esc(id)}"></div>`);
      }
      out.push("</section>");
    }
    tocEl.innerHTML = out.join("") + '<p class="nomatch" hidden>No page matches.</p>';
    searchEl.hidden = !manifest.docs.length;
  }
  function setActive(id, headings) {
    tocEl.querySelectorAll("a.doc").forEach((a) => a.classList.toggle("active", a.dataset.doc === id));
    tocEl.querySelectorAll(".sub").forEach((sub) => {
      sub.innerHTML = sub.dataset.sub === id
        ? headings.map((h) => `<a href="${esc(DFDocs.formatHash(id, h.id))}">${esc(h.text)}</a>`).join("") : "";
    });
  }
  function searchTerms() { return searchEl.value.toLowerCase().split(/\s+/).filter(Boolean); }
  function applyFilter() {
    const terms = searchTerms();
    document.body.classList.toggle("filtering", terms.length > 0);
    let shown = 0;
    tocEl.querySelectorAll("section.sec").forEach((sec) => {
      let n = 0;
      sec.querySelectorAll("a.doc").forEach((a) => {
        const d = byId.get(a.dataset.doc);
        const hay = (d.title + " " + (d.heading || "") + " " + d.repo_path + " " + (texts.get(a.dataset.doc) || "")).toLowerCase();
        const ok = terms.every((t) => hay.includes(t));
        a.hidden = !ok;
        n += ok ? 1 : 0;
      });
      sec.hidden = n === 0;
      shown += n;
    });
    const none = tocEl.querySelector(".nomatch");
    if (none) none.hidden = shown > 0;
  }
  function loadAllTexts() {  // the filter searches the text too: fetch every page once, on first use
    if (!textsLoading) {
      textsLoading = Promise.all(manifest.docs.map((d) => (texts.has(docId(d)) ? null : fetchDoc(docId(d)).catch(() => null))));
    }
    return textsLoading;
  }
  searchEl.addEventListener("input", () => {
    applyFilter();
    if (searchTerms().length) loadAllTexts().then(applyFilter);
  });

  function closeNav() {
    document.body.classList.remove("nav-open");
    navBtn.setAttribute("aria-expanded", "false");
  }
  navBtn.addEventListener("click", () => {
    const open = document.body.classList.toggle("nav-open");
    navBtn.setAttribute("aria-expanded", String(open));
  });
  $("df-scrim").addEventListener("click", closeNav);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeNav(); });

  // -- rendering -------------------------------------------------------------
  // GitHub alerts: a blockquote starting with [!NOTE], [!TIP], [!IMPORTANT], [!WARNING] or [!CAUTION].
  function markAlerts() {
    docEl.querySelectorAll("blockquote").forEach((bq) => {
      const p = bq.firstElementChild;
      if (!p || p.tagName !== "P" || !p.firstChild || p.firstChild.nodeType !== Node.TEXT_NODE) return;
      const m = p.firstChild.nodeValue.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i);
      if (!m) return;
      const kind = m[1].toLowerCase();
      p.firstChild.nodeValue = p.firstChild.nodeValue.slice(m[0].length);
      if (p.firstChild.nodeValue === "" && p.childNodes[1] && p.childNodes[1].nodeName === "BR") p.childNodes[1].remove();
      bq.classList.add("alert", "alert-" + kind);
      const title = document.createElement("p");
      title.className = "alert-t";
      title.textContent = kind;
      bq.prepend(title);
      if (!p.textContent.trim() && !p.children.length) p.remove();
    });
  }

  function render(entry, text) {
    const id = docId(entry);
    const body = DFDocs.stripFrontMatter(text);
    docEl.innerHTML = md
      ? md.render(body)
      : `<p class="note">The markdown renderer (markdown-it, from unpkg.com) did not load, so this is the raw text.</p><pre>${esc(body)}</pre>`;
    docEl.classList.remove("loading");
    markAlerts();
    // Heading ids as GitHub makes them, so file.md#some-heading links land here too.
    const slugger = DFDocs.makeSlugger();
    const headings = [];
    docEl.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((el) => {
      const label = el.textContent;
      const slug = slugger(label);
      if (!el.id) el.id = slug;
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = DFDocs.formatHash(id, el.id);
      a.textContent = "#";
      a.setAttribute("aria-label", "Link to this section");
      el.append(a);
      if (el.tagName === "H2") headings.push({ id: el.id, text: label.trim() });
    });
    docEl.querySelectorAll("a[href]").forEach((a) => {
      if (a.classList.contains("anchor")) return;
      const href = a.getAttribute("href");
      const out = DFDocs.resolveLink(href, entry.repo_path, ctx);
      if (out !== href) a.setAttribute("href", out);
      if (/^https?:\/\//i.test(out)) { a.target = "_blank"; a.rel = "noopener"; }
    });
    docEl.querySelectorAll("img[src]").forEach((img) => {
      img.setAttribute("src", DFDocs.resolveAsset(img.getAttribute("src"), entry.repo_path, ctx));
    });
    footEl.innerHTML = `Source: <a href="${esc(blobUrl(entry.repo_path))}" target="_blank" rel="noopener"><code>${esc(entry.repo_path)}</code></a>`
      + (STATIC ? "" : " (shown from this checkout; the link opens main on GitHub)");
    document.title = (entry.heading || entry.title) + " · Data Foundry guidelines";
    setActive(id, headings);
  }
  function githubLinks() {
    return manifest.sections.map((s) => `<a href="${esc(blobUrl(".claude/skills/" + s.skill + "/SKILL.md"))}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(" · ");
  }
  function renderMessage(title, html) {
    docEl.classList.remove("loading");
    docEl.innerHTML = `<h1>${esc(title)}</h1>${html}`;
    footEl.innerHTML = "";
    setActive(null, []);
  }

  async function showDoc(id, seq) {
    const entry = byId.get(id);
    if (!entry) {
      renderMessage("Page not found", `<p>There is no guideline page <code>${esc(id)}</code>. `
        + `It may have moved: try <a href="${esc(blobUrl(".claude/skills/" + id))}" target="_blank" rel="noopener">the file on GitHub</a> `
        + `or the <a href="${esc(DFDocs.formatHash(docId(manifest.docs[0])))}">overview</a>.</p>`);
      return;
    }
    setActive(id, []);
    docEl.classList.add("loading");
    let text;
    try {
      text = await fetchDoc(id);
    } catch (e) {
      if (seq === loadSeq) {
        renderMessage(entry.title, `<p class="note">Could not load <code>${esc(entry.repo_path)}</code> (${esc(e.message)}). `
          + `Read it <a href="${esc(blobUrl(entry.repo_path))}" target="_blank" rel="noopener">on GitHub</a>.</p>`);
      }
      return;
    }
    if (seq === loadSeq) render(entry, text);
  }

  function findHeading(h) {
    const all = [...docEl.querySelectorAll("[id]")];
    return all.find((el) => el.id === h) || all.find((el) => el.id.toLowerCase() === h.toLowerCase()) || null;
  }
  function scrollToHeading(h) {
    const el = h ? findHeading(h) : null;
    if (!el) { window.scrollTo(0, 0); return; }
    el.scrollIntoView({ block: "start" });
    el.classList.remove("target");
    void el.offsetWidth;  // restart the highlight animation
    el.classList.add("target");
  }

  async function route() {
    closeNav();
    const { doc } = DFDocs.parseHash(location.hash);
    const id = doc || docId(manifest.docs[0]);
    if (id !== current) {
      current = id;
      const seq = ++loadSeq;
      await showDoc(id, seq);
      if (seq !== loadSeq) return;  // a newer navigation took over
    }
    scrollToHeading(DFDocs.parseHash(location.hash).h);  // the heading may have changed while loading
  }
  // A click on the link of the hash already shown fires no hashchange: scroll anyway.
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest("a[href^='#']");
    if (a && a.getAttribute("href") === location.hash) {
      e.preventDefault();
      closeNav();
      scrollToHeading(DFDocs.parseHash(location.hash).h);
    }
  });

  async function init() {
    try {
      manifest = await loadManifest();
    } catch (e) {
      renderMessage("Guidelines unavailable", `<p class="note">The list of guideline pages did not load (${esc(e.message)}).</p>`
        + `<p>Read them on GitHub: <a href="${esc(blobUrl(".claude/skills/knowledge-curation/SKILL.md"))}" target="_blank" rel="noopener">Curation knowledge</a>`
        + ` · <a href="${esc(blobUrl(".claude/skills/knowledge-data-foundry/SKILL.md"))}" target="_blank" rel="noopener">Data Foundry</a>.</p>`);
      searchEl.hidden = true;
      return;
    }
    ctx = {
      blobBase: String(manifest.github_blob_base || DEFAULT_BLOB).replace(/\/+$/, ""),
      skills: manifest.sections.map((s) => s.skill).filter((s) => s !== START),
      page: "",
      // Every listed page by its repo path, so a link to .claude/skills/README.md opens Start here.
      docs: new Map(manifest.docs.map((d) => [d.repo_path, docId(d)])),
    };
    byId = new Map(manifest.docs.map((d) => [docId(d), d]));
    buildNav();
    if (!manifest.docs.length) {
      renderMessage("Guidelines", `<p>No guideline files were found next to this ${STATIC ? "site" : "server"}. This page renders the `
        + `markdown files of ${manifest.sections.map((s) => `<code>.claude/skills/${esc(s.skill)}/</code>`).join(" and ")}, `
        + `which a non-editable install of the package does not include.</p><p>Read them on GitHub: ${githubLinks()}.</p>`);
      return;
    }
    window.addEventListener("hashchange", route);
    route();
  }
  init();
})();
</script>
</body>
</html>
