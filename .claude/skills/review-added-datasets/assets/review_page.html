<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: a curator's review desk, in the family of the TabArena Task Summaries page. The ledger of records on the
   left, the open case file on the right: the record's facts and links first, then tabs that open on the use
   case, then the verdict box, the one boxed object that is always in view at the end of the case. */
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --surface-2: #eceeea;
  --ink: #1c2420;
  --ink-2: #4a544f;
  --ink-3: #7a837e;
  --rule: #d9ddd8;
  --accent: #2f5d50;
  --accent-soft: #e1ece8;
  --direct: #2e7d4f;
  --direct-soft: #e2f1e7;
  --approx: #9a6a00;
  --approx-soft: #f7eccd;
  --none: #b23a2e;
  --none-soft: #f8e1dd;
  --discuss: #5f4aa0;
  --discuss-soft: #ebe7f4;
  /* Verdict colours share the fit colours: ship = direct, change = approximate, stop = none. */
  --ok: var(--direct);
  --ok-soft: var(--direct-soft);
  --change: var(--approx);
  --change-soft: var(--approx-soft);
  --stop: var(--none);
  --stop-soft: var(--none-soft);
  --font-display: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --hdr: 7.25rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --surface: #1b211f; --surface-2: #232a27; --ink: #e6ebe8; --ink-2: #b4bdb8; --ink-3: #87918c;
    --rule: #2f3834; --accent: #8cc4b2; --accent-soft: #1f3a32; --direct: #79c99a; --direct-soft: #1c3527;
    --approx: #e2b44e; --approx-soft: #3a3019; --none: #f08d80; --none-soft: #3d221f;
    --discuss: #bba5f0; --discuss-soft: #2b2440;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1b211f; --surface-2: #232a27; --ink: #e6ebe8; --ink-2: #b4bdb8; --ink-3: #87918c;
  --rule: #2f3834; --accent: #8cc4b2; --accent-soft: #1f3a32; --direct: #79c99a; --direct-soft: #1c3527;
  --approx: #e2b44e; --approx-soft: #3a3019; --none: #f08d80; --none-soft: #3d221f;
  --discuss: #bba5f0; --discuss-soft: #2b2440;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--rule);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.top-inner { max-width: 1480px; margin: 0 auto; padding-block: .8rem .6rem; display: grid; gap: .55rem; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem 1.2rem; }
.title-row h1 { margin: 0; font: 600 1.35rem/1.2 var(--font-display); text-wrap: balance; }
.title-row .sub { color: var(--ink-3); font-size: .85rem; }
.status { margin-left: auto; display: flex; align-items: center; gap: .45rem; font-size: .8rem; color: var(--ink-3); }
.status .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--ink-3); flex: none; }
.status[data-s="saved"] .dot, .status[data-s="shared"] .dot { background: var(--ok); }
.status[data-s="saving"] .dot { background: var(--change); }
.status[data-s="local"] .dot { background: var(--change); }
.status[data-s="error"] .dot, .status[data-s="readonly"] .dot { background: var(--stop); }
.nav-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; }
.tabs { display: flex; gap: .3rem; }
.tab {
  border: 1px solid transparent; background: none; padding: .3rem .7rem; border-radius: 6px; cursor: pointer;
  font-weight: 500; font-size: .85rem; color: var(--ink-2);
}
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface); border-color: var(--rule); }
.progress { display: flex; align-items: center; gap: .7rem; flex: 1 1 18rem; min-width: 0; font-size: .85rem; color: var(--ink-3); }
.meter { flex: 1 1 8rem; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; max-width: 22rem; }
.meter span { display: block; height: 100%; }
.meter .m-ship { background: var(--ok); }
.meter .m-changes { background: var(--change); }
.meter .m-dont { background: var(--stop); }
.meter .m-discuss { background: var(--discuss); }
.progress b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.banner {
  max-width: 1480px; margin: .6rem auto 0; padding: .5rem .8rem; border-radius: 6px; font-size: .88rem;
  background: var(--approx-soft); color: var(--ink); border: 1px solid var(--rule);
}
.banner[hidden] { display: none; }

/* Views */
.view { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.desk { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: minmax(17rem, 22rem) minmax(0, 1fr); gap: 0 2rem; }
.rail {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr)); align-self: start;
  max-height: calc(100dvh - var(--hdr) - env(safe-area-inset-top, 0px)); overflow: auto;
  padding-block: 1rem 2rem; border-right: 1px solid var(--rule); padding-right: 1rem;
}
.search { width: 100%; padding: .4rem .6rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); font-size: .9rem; }
.filters { display: flex; flex-wrap: wrap; gap: .35rem; margin-block: .6rem .4rem; }
.chipbtn {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: .15rem .6rem;
  font-size: .8rem; font-weight: 500; cursor: pointer; color: var(--ink-2);
}
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chipbtn .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: .3rem; }
.toggle { display: flex; align-items: center; gap: .4rem; font-size: .82rem; color: var(--ink-2); margin-bottom: .3rem; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem .7rem; font-size: .74rem; color: var(--ink-3); margin: 0 0 .6rem; }
.legend span { display: inline-flex; align-items: center; gap: .3rem; }
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.list li + li { border-top: 1px solid var(--rule); }
.list li.grp {
  font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; color: var(--ink-3);
  padding: .7rem .3rem .25rem; display: flex; justify-content: space-between;
}
.list li.grp .n { font-weight: 500; font-variant-numeric: tabular-nums; }
.rowbtn {
  width: 100%; text-align: left; background: none; border: 0; padding: .45rem .3rem; cursor: pointer;
  display: grid; grid-template-columns: .75rem minmax(0, 1fr) auto; gap: .55rem; align-items: center;
}
.rowbtn:hover { background: var(--surface-2); }
.rowbtn[aria-current="true"] { background: var(--accent-soft); }
.vdot { width: .7rem; height: .7rem; border-radius: 50%; border: 1.5px solid var(--ink-3); }
.vdot[data-v="ship"] { background: var(--ok); border-color: var(--ok); }
.vdot[data-v="changes"] { background: var(--change); border-color: var(--change); }
.vdot[data-v="dont"] { background: var(--stop); border-color: var(--stop); }
.vdot[data-v="discuss"] { background: var(--discuss); border-color: var(--discuss); }
.rowname { font-family: var(--font-mono); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.needverdict { color: var(--accent); font-weight: 600; }
.parkedtag { color: var(--ink-3); font-weight: 600; }
.rowmeta { font-size: .72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: .45rem; }
/* The use-case fit: a small square, so it never reads as the round verdict dot. */
.fitmark { display: inline-block; width: .5rem; height: .5rem; border-radius: 2px; background: var(--ink-3); flex: none; }
.fitmark.direct { background: var(--direct); } .fitmark.approximate { background: var(--approx); } .fitmark.none { background: var(--none); }
.fitmark.missing { background: transparent; border: 1px dashed var(--ink-3); }
.tag { display: inline-block; font-size: .7rem; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; padding: .05rem .45rem; border-radius: 4px; line-height: 1.5; }
.tag.added { background: var(--ok-soft); color: var(--ok); }
.tag.noship { background: var(--stop-soft); color: var(--stop); }
.tag.notadded { background: var(--surface-2); color: var(--ink-2); }
.tag.late { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tag.decided { background: var(--surface-2); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--ink-3); }
.tag.prio { background: var(--accent-soft); color: var(--accent); }
.tag.prio.none { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--rule); }
.readonly-items .item .seg, .readonly-items .item textarea { display: none; }

/* Case file: the start mirrors the task-summary case view */
.case { padding-block: 1.25rem 4rem; min-width: 0; max-width: 62rem; }
.triage, .question, dl.fields dd, .judge p, .srcnote, .missing-note { overflow-wrap: anywhere; }
.back { display: none; margin-bottom: .8rem; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: .3rem .7rem; cursor: pointer; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .5rem; font-size: .78rem; color: var(--ink-3); }
.eyebrow .facts { display: inline-flex; flex-wrap: wrap; gap: .1rem .4rem; text-transform: uppercase; letter-spacing: .05em; }
.eyebrow .facts span + span::before { content: "·"; margin-right: .4rem; }
.case-name { margin: .35rem 0 .25rem; font: 500 1.2rem/1.3 var(--font-mono); overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; font-size: .82rem; }
.links a { color: var(--accent); }
.links .jump { margin-left: auto; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; font-size: .82rem; text-decoration: underline; text-underline-offset: 2px; }
.case h3 {
  font: 600 1.12rem/1.3 var(--font-display); margin: 2rem 0 .6rem;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .8rem;
}
.case h3 .count { font-family: var(--font-body); font-weight: 400; font-size: .82rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.triage {
  margin: 1.1rem 0 0; max-width: 820px; border-left: 4px solid var(--ink-3); background: var(--surface);
  padding: .75rem 1rem; border-radius: 0 6px 6px 0;
}
.case .triage h3, .verdict-box h3, .judge h3 {
  margin: 0 0 .4rem; font: 600 .78rem/1.4 var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3);
}
.triage .facts { margin: 0 0 .4rem; color: var(--ink-2); font-size: .9rem; }

/* The use case tab, as on the task-summary page */
.question { font: 500 1.4rem/1.35 var(--font-display); margin: .4rem 0 1.2rem; max-width: 46ch; text-wrap: balance; }
dl.fields { display: grid; grid-template-columns: 11.5rem minmax(0, 1fr); gap: .65rem 1.2rem; margin: 0; max-width: 820px; }
dl.fields dt { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); padding-top: .2rem; }
dl.fields dd { margin: 0; max-width: 68ch; }
dt.usecase + dd { font-weight: 500; }
.metricbox { margin-top: 1.6rem; max-width: 820px; }
.metricbox h3 { margin: 0 0 .6rem; font: 600 .78rem/1.4 var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.metricbox dd code { font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); padding: .05em .3em; border-radius: 3px; }
.metricbox dd a { overflow-wrap: anywhere; }
.metricmark { margin-top: 1rem; border-bottom: 0; }
.metricmark .seg, .metricmark .note { margin-left: 0; }
.metricmark .note { width: 100%; }
.judge { margin-top: 1.6rem; max-width: 820px; border-left: 4px solid var(--ink-3); background: var(--surface); padding: .8rem 1rem; border-radius: 0 6px 6px 0; }
.judge.direct { border-color: var(--direct); } .judge.approximate { border-color: var(--approx); } .judge.none { border-color: var(--none); }
.judge p { margin: .3rem 0 0; max-width: 68ch; }
.pill { display: inline-block; font: 600 .8rem var(--font-body); padding: .1rem .55rem; border-radius: 999px; margin-right: .5rem; white-space: nowrap; }
.pill.direct { background: var(--direct-soft); color: var(--direct); } .pill.approximate { background: var(--approx-soft); color: var(--approx); } .pill.none { background: var(--none-soft); color: var(--none); }
.pill.missing { background: var(--surface-2); color: var(--ink-3); font-weight: 500; }
.state { font-size: .78rem; color: var(--ink-3); }
.srcnote { margin: .9rem 0 0; font-size: .8rem; color: var(--ink-3); max-width: 820px; }
.missing-note { color: var(--ink-3); font-style: italic; max-width: 68ch; }
.ctab .fitmark { margin-left: .4rem; vertical-align: .08em; }

/* Verdict box */
.verdict-box {
  margin-top: 2rem; max-width: 820px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: .9rem 1rem;
  scroll-margin-top: calc(var(--hdr) + 1rem);
}
.seg { display: flex; flex-wrap: wrap; gap: .35rem; }
.opt {
  border: 1px solid var(--rule); background: var(--surface); padding: .32rem .75rem; border-radius: 6px; cursor: pointer;
  font-size: .85rem; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: .35rem;
}
.opt:hover { color: var(--ink); border-color: var(--ink-3); }
.opt .rec { font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; color: var(--accent); }
.opt[aria-pressed="true"][data-v="ship"], .opt[aria-pressed="true"][data-v="ok"], .opt[aria-pressed="true"][data-v="update"], .opt[aria-pressed="true"][data-v="correct"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.opt[aria-pressed="true"][data-v="changes"], .opt[aria-pressed="true"][data-v="change"], .opt[aria-pressed="true"][data-v="leave"], .opt[aria-pressed="true"][data-v="keep"] { background: var(--change-soft); border-color: var(--change); color: var(--change); }
.opt[aria-pressed="true"][data-v="dont"] { background: var(--stop-soft); border-color: var(--stop); color: var(--stop); }
.opt[aria-pressed="true"][data-v="discuss"] { background: var(--discuss-soft); border-color: var(--discuss); color: var(--discuss); }
.opt[aria-pressed="true"] .rec { color: inherit; }
.seg.small .opt { padding: .2rem .55rem; font-size: .8rem; }
.notelabel { display: block; font-size: .8rem; color: var(--ink-2); margin: .8rem 0 .25rem; }
textarea.note {
  width: 100%; resize: vertical; min-height: 2.2rem; padding: .45rem .6rem; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--bg); line-height: 1.45; font-size: .88rem;
}
textarea.note.big { min-height: 4.2rem; }
.readonly textarea.note, .readonly .opt { cursor: default; }
.intro { color: var(--ink-2); margin-bottom: .6rem; }
.items { list-style: none; margin: 0; padding: 0; }
.item { padding-block: 1rem; border-top: 1px solid var(--rule); }
.item.resolved { opacity: .62; }
.item:last-child { border-bottom: 1px solid var(--rule); }
.item-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .1rem .7rem; align-items: start; }
.num {
  font-family: var(--font-mono); font-size: .78rem; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 4px;
  min-width: 1.7rem; text-align: center; padding: .05rem .25rem; margin-top: .12rem; font-variant-numeric: tabular-nums;
}
.item h4 { margin: 0; font-size: .98rem; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.item .seg { margin: .55rem 0 0 2.4rem; }
.item .body { margin: .55rem 0 0 2.4rem; }
.item .note { margin: .5rem 0 0 2.4rem; width: calc(100% - 2.4rem); }
.statepill { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-left: .4rem; }
.statepill[data-v="ok"] { color: var(--ok); }
.statepill[data-v="change"], .statepill[data-v="leave"] { color: var(--change); }
.statepill[data-v="discuss"] { color: var(--discuss); }
.clamp { max-height: 10.5rem; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
/* The conversation on an issue or item: the original text, then one turn per answer, note or closing label */
.thread { list-style: none; margin: .7rem 0 0 2.4rem; padding: 0; display: grid; gap: .5rem; }
.turn { border: 1px solid var(--rule); border-left-width: 4px; border-radius: 0 8px 8px 0; padding: .45rem .75rem .55rem; background: var(--surface); max-width: 78ch; }
.turn.ai { border-left-color: var(--accent); background: var(--accent-soft); }
.turn.curator { border-left-color: var(--discuss); background: var(--discuss-soft); margin-left: 1.5rem; }
.turn.closed { border-left-color: var(--ok); background: var(--ok-soft); }
.turn.closed.deferred { border-left-color: var(--ink-3); background: var(--surface-2); }
.turn .who { font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin-bottom: .15rem; display: flex; flex-wrap: wrap; gap: .2rem .6rem; }
.turn .who .when { font-weight: 500; color: var(--ink-3); text-transform: none; letter-spacing: 0; }
.turn .md p { margin: .25rem 0; }
.origlabel { font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: .55rem 0 0 2.4rem; }
.replybox { margin: .5rem 0 0 2.4rem; max-width: 78ch; border: 1px solid var(--accent); border-radius: 8px; padding: .5rem .6rem .6rem; background: var(--surface); display: grid; gap: .35rem; }
.replybox .rlabel { font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.replybox .rdone { margin-left: .4rem; color: var(--ok); text-transform: none; letter-spacing: 0; }
.replybox .choice { display: flex; gap: .55rem; align-items: baseline; text-align: left; width: 100%; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; padding: .4rem .6rem; font-size: .85rem; line-height: 1.4; color: var(--ink); cursor: pointer; }
.replybox .choice:hover { border-color: var(--accent); }
.replybox .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.replybox .choice .ck { font-weight: 700; color: var(--accent); flex: none; }
.replybox .choice.short { width: auto; display: inline-flex; }
.replybox:has(.short) { display: flex; flex-wrap: wrap; align-items: center; }
.replybox:has(.short) .rlabel { width: 100%; }
@media (max-width: 860px) { .replybox { margin-left: 0; } }
.earlier { font-size: .7rem; font-weight: 500; margin-left: .5rem; padding: .05rem .45rem; border-radius: 4px; border: 1px dashed var(--rule); color: var(--ink-3); white-space: nowrap; }
.yourturn { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-left: .5rem; padding: .05rem .45rem; border-radius: 4px; background: var(--approx-soft); color: var(--approx); white-space: nowrap; }
@media (max-width: 860px) { .thread, .origlabel { margin-left: 0; } .turn.curator { margin-left: .8rem; } }
.more { margin: .3rem 0 0 2.4rem; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: .84rem; font-weight: 500; }
.more[hidden] { display: none; }

/* Rendered markdown */
.md { font-size: .92rem; color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: .45rem 0; max-width: 78ch; }
.md ul, .md ol { margin: .35rem 0; padding-left: 1.3rem; }
.md li { margin: .15rem 0; }
.md li > p { margin: .2rem 0; }
.md code, .srcnote code, .missing-note code, .intro code { font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); padding: .05em .3em; border-radius: 3px; font-style: normal; }
.md strong { font-weight: 600; }
.md a { color: var(--accent); }

<script>

  const VERDICTS = {
    standard: [["ship", "Ship"], ["changes", "Ship after changes"], ["dont", "Don't ship"], ["discuss", "Discuss"]],

  const VLABEL_NA = { ship: "Add it", dont: "Leave out", discuss: "Discuss" };
  // A record that already says No: only the triage update is verified (an older "dont" mark counts as correct).
  const VLABEL_DEC = { correct: "Triage update correct", dont: "Triage update correct", discuss: "Discuss", ship: "Ship (overrules triage)", changes: "Ship after changes (overrules triage)" };
  const REC = { added: "ship", noship: "dont", notadded: "dont", decided: "correct" };
  const CAT = { added: "To ship", noship: "Rec. not to ship", notadded: "Not added", decided: "Decided: verify" };

  const ITEM_OPTS = [["ok", "As implemented"], ["change", "Change"], ["discuss", "Discuss"]];
  // The mark on the declared metric (stored as `metric: {d, note}` on the record's review document).

  const METRIC_LABEL = { ok: "As declared", change: "Change", discuss: "Discuss" };
  // The metric is on the page only when the round asks about it (`metricMark`: the collector's --metric-marks; Lennart,
  // 2026-11-10, "hidden unless asked for"), and takes a mark until the record carries the curator's CC line that it
  // is checked (then it is resolved).
  const hasMetricMark = (d) => !!d.metricMark && !!d.metric && !!d.folder && !d.retired && d.cat !== "decided" && !d.metricChecked;
  const X_OPTS = [["ok", "Go ahead"], ["leave", "Leave as is"], ["discuss", "Discuss"]];
  const FIELD_OPTS = [["update", "Take definition's value"], ["keep", "Keep record's value"]];
  /* A record-field row's buttons name the value each one leaves in the record. */
  const short = (v) => (String(v).length > 28 ? String(v).slice(0, 27) + "\u2026" : String(v));
  const fieldOpts = (f) => [["update", "Use definition: " + short(f.definition)], ["keep", "Keep record: " + short(f.record)]];
  const OPT_LABEL = { ok: "As implemented", change: "Change", discuss: "Discuss", leave: "Leave as is", update: "Take definition's value", keep: "Keep record's value" };
  const X_LABEL = { ok: "Go ahead", leave: "Leave as is", discuss: "Discuss" };
  // The task summary, labelled and judged as on the TabArena Task Summaries page.

    ["use_case", "Use case"], ["row", "One row"], ["predicted", "Predicted"], ["known", "Known at prediction time"],
    ["known_at_scoring", "Known only when scoring"], ["split", "What the test data stands for"], ["changes", "Our changes to the source"],
  ];
  const FIT = { direct: "Direct", approximate: "Approximate", none: "None" };
  const FIT_LONG = {
    direct: "the rows, features and split mirror the use case",
    approximate: "a stand-in with a known gap",
    none: "no decision fits; such a dataset is retired",
  };
  const REGIME = { iid: "Random split", grouped: "Grouped split", temporal: "Temporal split" };
  const PROBLEM = { binary_classification: "Binary classification", multiclass_classification: "Multiclass classification", regression: "Regression" };
  const CTABS = ["usecase", "decisions", "panel", "details", "code", "report", "record"];
  const fitOf = (d) => (d.summary && FIT[d.summary.fit] ? d.summary.fit : null);

  const S = { reviews: {}, crosscut: {} };
  const ui = { view: "datasets", current: DS.length ? DS[0].name : null, filter: "all", q: "", hideReviewed: false, detailOpen: false };
  let mode = "connecting";
  let db = null;
  let userId = null;

  function store(k, v) { try { localStorage.setItem("ndr-ui:" + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  function recall(k, d) { try { const v = localStorage.getItem("ndr-ui:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  ui.filter = recall("filter", "all");
  ui.hideReviewed = recall("hideReviewed", false);
  ui.ctab = recall("ctab", "usecase");
  ui.showResolved = false; // resolved issues start hidden on every visit
  if (!CTABS.includes(ui.ctab)) ui.ctab = "usecase";
  // GitHub links: the branch the page was built on; a retired definition at the last commit that still had it.
  const GH = DATA.github;
  const ghAt = (commit) => DATA.githubRepo + "/blob/" + commit + "/";

  const savedCurrent = recall("current", null);
  if (savedCurrent && byName.has(savedCurrent)) ui.current = savedCurrent;

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const escCode = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  // The conversation on an issue or item (from the builder's `thread`): who spoke, when, and what was said.
  const fmtDay = (iso) => { const p = String(iso || "").split("-"); if (p.length !== 3) return esc(iso); const m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1] - 1]; return (+p[2]) + " " + m + " " + p[0]; };
  const TURN_WHO = { ai: "Claude", curator: "You", closed: "Closed" };
  const TURN_KIND = { answer: "answer", "consistency check": "consistency check", note: "note", resolved: "resolved", deferred: "deferred" };
  function threadHtml(it) {
    const turns = it.thread || [];
    if (!turns.length) return "";
    return '<ol class="thread" aria-label="Conversation">' + turns.map((u) => {
      let who = TURN_WHO[u.who] || u.who;
      if (u.who === "closed") who = (u.kind === "deferred" ? "Deferred" : "Resolved") + (u.by ? " · " + esc(u.by) : "");
      else who = (u.who === "curator" && u.by ? esc(u.by) : who) + " · " + esc(TURN_KIND[u.kind] || u.kind) + (u.mark ? " (" + esc(u.mark) + ")" : "");
      return '<li class="turn ' + esc(u.who) + (u.kind === "deferred" ? " deferred" : "") + '"><div class="who"><span>' + who + '</span><span class="when">' + fmtDay(u.date) + "</span></div>" +
        '<div class="md">' + u.html + "</div></li>";
    }).join("") + "</ol>";
  }
  const awaitsCurator = (it) => !it.resolved && (it.thread || []).length > 0 && it.thread[it.thread.length - 1].who === "ai";
  /* An issue the AI answered or re-opened waits on the curator: its earlier mark no longer counts until the curator
     marks it (or writes a note) in reply to that turn, stored as `re` (the turn's id, `askId`) beside the mark. */
  const pending = (it, st) => awaitsCurator(it) && (!st || st.re !== it.askId);
  const shownSt = (it, st) => (pending(it, st) ? { note: st.note } : st);
  const yourTurn = (it, st) => (awaitsCurator(it) && (st === undefined || pending(it, st)) ? '<span class="yourturn" title="Claude answered; your mark is next">Your turn</span>' : "");
  const earlierMark = (it, st) => (pending(it, st) && st.d ? '<span class="earlier" title="Your mark before Claude\u2019s last turn; it counts again once you mark the issue">before: ' + esc(itemPill(it, st)) + "</span>" : "");
  /* The answer buttons under the AI's last turn: its lettered choices, or Agree / Disagree when it asks no letter. A
     click writes the reply as the note's first line ("Reply (a): ..." or "Agree.") and counts as the curator's answer. */
  const REPLY_LINE = /^\s*(?:Reply \(([a-z])\)|(Agree)\.|(Disagree)\b)[^\n]*\n?/;
  function replyKey(st) { const m = REPLY_LINE.exec((st && st.note) || ""); return m ? (m[1] || (m[2] ? "agree" : "disagree")) : ""; }
  function replyHtml(it, st) {
    if (!awaitsCurator(it)) return "";
    const turn = it.thread[it.thread.length - 1];
    const answered = st && st.re === it.askId ? replyKey(st) : "";
    const ro = mode === "readonly" ? " disabled" : "";
    const btn = (k, inner, cls) => '<button type="button" class="choice' + (cls ? " " + cls : "") + '" data-act="reply" data-n="' + it.n + '" data-k="' + k + '" aria-pressed="' + (answered === k) + '"' + ro + ">" + inner + "</button>";
    const choices = turn.choices || [];
    const body = choices.length
      ? choices.map((c) => btn(c.key, '<span class="ck">(' + esc(c.key) + ')</span><span class="ct">' + c.html + "</span>")).join("")
      : btn("agree", '<span class="ct">Agree</span>', "short") + btn("disagree", '<span class="ct">Disagree: say why in the note</span>', "short");
    return '<div class="replybox" id="reply-' + it.n + '"><div class="rlabel">Your answer to Claude' + (answered ? ' <span class="rdone">sent</span>' : "") + "</div>" + body + "</div>";
  }
  /* The row of the AI turn's options table that the curator's reply picked, highlighted like an issue's pick. */
  function markReply(li, it, st) {
    const tab = li && li.querySelector(".thread > .turn:last-child table.opttab");
    if (!tab) return;
    const k = st && st.re === it.askId ? replyKey(st) : "";
    tab.classList.toggle("has-pick", !!k && k !== "agree" && k !== "disagree");
    tab.querySelectorAll("tbody tr").forEach((tr) => {
      const on = !!k && tr.dataset.key === k;
      tr.classList.toggle("picked", on);
      const tag = tr.querySelector(".otag.pick");
      if (tag) { tag.hidden = !on; tag.textContent = "your answer"; }
    });
  }
  const origLabel = (it) => ((it.thread || []).length ? '<p class="origlabel">The question</p>' : "");
  const slug = (s) => String(s).replace(/[^A-Za-z0-9_-]/g, "-");

  function rev(name) {
    let r = S.reviews[name];
    if (!r) { r = S.reviews[name] = { items: {}, fields: {} }; }
    if (!r.items) r.items = {};
    if (!r.fields) r.fields = {};
    return r;
  }
  function peekRev(name) { return S.reviews[name] || { items: {}, fields: {} }; }
  function xdoc(id) { return S.crosscut[id] || (S.crosscut[id] = {}); }

  /* A record of the review with no open issue, no open field row and no open metric ships by default (Lennart,
     2026-11-05): its verdict is "ship" unless the curator sets another. */
  // A record with a deferred (parked) issue waits: its metric is not marked and it does not ship until the issue returns.
  const parked = (d) => d.items.some((it) => it.resolved && (it.thread || []).length && it.thread[it.thread.length - 1].kind === "deferred");
  const shipsByDefault = (d) => d.cat === "added" && !parked(d) && counts(d).total === 0;
  const verdictOf = (d) => peekRev(d.name).verdict || (shipsByDefault(d) ? "ship" : null);
  /* The marks left on a record, or "done" once none is open. */
  function markCount(d, c, r) {
    if (c.total === 0 && parked(d) && !r.verdict) return '<span class="parkedtag" title="An issue is parked (deferred); the record waits for it">parked</span>';
    if (c.total === 0) return r.verdict ? "done" : '<span class="needverdict" title="Every issue is settled, so it ships">ship (no issues)</span>';
    return c.done + "/" + c.total;
  }
  function counts(d) {
    const r = peekRev(d.name);
    if (d.cat === "decided") return { done: r.verdict ? 1 : 0, total: 1 };
    const items = r.items || {}, fields = r.fields || {};
    // A resolved issue is done and not counted; an issue that waits on the curator's reply counts as unmarked.
    let done = 0, total = d.fields.length;
    d.items.forEach((it) => {
      if (it.resolved) return;
      const st = items[it.n] || {};
      total++;
      if (st.d && !pending(it, st)) done++;
    });
    d.fields.forEach((f) => { if (fields[f.key]) done++; });
    if (hasMetricMark(d) && !parked(d)) { total++; if (r.metric && r.metric.d) done++; }
    return { done, total };
  }

  /* ---------- saving ---------- */
  const dirty = new Set(), inflight = new Set();
  let flushTimer = null;
  function setStatus(s, text) {
    const el = document.getElementById("status");
    el.dataset.s = s;
    document.getElementById("statusText").textContent = text;
  }
  function modeStatus() {
    if (mode === "shared") setStatus("shared", "Saved to the shared review");
    else if (mode === "local") setStatus("local", "Saved in this browser only");
    else if (mode === "readonly") setStatus("readonly", "Read only: changes are not saved");
    else setStatus("connecting", "Connecting…");
  }
  function banner(text) {
    const b = document.getElementById("banner");

    setHdr();
  }
  function setHdr() {
    const narrow = window.matchMedia("(max-width: 860px)").matches;

  }
  window.addEventListener("resize", setHdr);
  function stable(o) {
    if (Array.isArray(o)) return "[" + o.map(stable).join(",") + "]";
    if (o && typeof o === "object") return "{" + Object.keys(o).sort().map((k) => JSON.stringify(k) + ":" + stable(o[k])).join(",") + "}";
    return JSON.stringify(o);
  }
  function touch(coll, id, slow) {
    if (mode === "readonly") return;
    const doc = coll === "reviews" ? rev(id) : xdoc(id);
    doc.updatedAt = new Date().toISOString();
    if (userId) doc.by = userId;
    dirty.add(coll + "/" + id);
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, slow ? 700 : 150);
    if (mode !== "connecting") setStatus("saving", "Saving…");
  }
  function cleanDoc(doc) {
    const out = JSON.parse(JSON.stringify(doc));
    if (out.items) {
      Object.keys(out.items).forEach((k) => {
        const it = out.items[k];
        if (!it || (!it.d && !(it.note || "").trim())) delete out.items[k];
      });
    }
    if (out.fields) Object.keys(out.fields).forEach((k) => { if (!out.fields[k]) delete out.fields[k]; });
    if (out.metric && !out.metric.d && !(out.metric.note || "").trim()) delete out.metric;
    return out;
  }
  async function persist(path) {
    const [coll, id] = path.split("/");
    const doc = cleanDoc(coll === "reviews" ? rev(id) : xdoc(id));
    if (mode === "shared") {
      await db.doc(path).set(doc);
    } else if (mode === "local") {
      try { localStorage.setItem("ndr-doc:" + path, JSON.stringify(doc)); } catch (e) { /* ignore */ }
    }
  }
  async function flush() {
    if (mode === "connecting") { flushTimer = setTimeout(flush, 400); return; }

      if (inflight.has(path)) continue;
      dirty.delete(path);
      inflight.add(path);
      try {
        await persist(path);
      } catch (e) {
        const code = e && e.code;
        if (code === "invalid_argument" || code === "not_granted") {
          mode = "readonly";
          banner("This view can read the review but not save to it. Your marks on this page are kept until you reload.");
        } else if (code === "quota_exceeded") {
          banner("The review store is full, so this change was not saved.");
        } else {
          dirty.add(path);

          inflight.delete(path);

  }

  /* ---------- rendering: header ---------- */
  function renderProgress() {
    const tally = { ship: 0, changes: 0, dont: 0, discuss: 0 };
    let reviewed = 0, done = 0, total = 0;
    DS.forEach((d) => {
      const v = verdictOf(d);
      if (v) { reviewed++; tally[v] = (tally[v] || 0) + 1; }
      const c = counts(d); done += c.done; total += c.total;
    });
    let xdone = 0;
    XITEMS.forEach((_, id) => { if (S.crosscut[id] && S.crosscut[id].d) xdone++; });
    const pct = (n) => (DS.length ? (100 * (n || 0)) / DS.length : 0).toFixed(2) + "%";
    document.getElementById("progress").innerHTML =
      '<span><b>' + reviewed + "</b>/" + DS.length + " verdicts</span>" +
      '<span class="meter" aria-hidden="true">' +
      ["ship", "changes", "dont", "discuss"].map((k) => '<span class="m-' + k + '" style="width:' + pct(tally[k]) + '"></span>').join("") +
      "</span>" +
      "<span><b>" + done + "</b>/" + total + " marks</span>" +
      "<span><b>" + xdone + "</b>/" + XITEMS.size + " across</span>";
  }

  /* ---------- rendering: rail ---------- */
  function visible(d) {
    if (ui.filter === "late" && !d.late) return false;
    if (["added", "noship", "notadded", "decided"].includes(ui.filter) && d.cat !== ui.filter) return false;
    if (ui.hideReviewed && peekRev(d.name).verdict && d.name !== ui.current) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();

    }

  }
  function renderFilters() {

      ["all", "All", DS.length],
      ["added", "To ship", n((d) => d.cat === "added")],
      ["noship", "Rec. not to ship", n((d) => d.cat === "noship")],
      ["notadded", "Not added", n((d) => d.cat === "notadded")],

    let group;

        '<span class="vdot"' + (verdictOf(d) ? ' data-v="' + esc(verdictOf(d)) + '"' : "") + '></span>' +
        '<span class="rowname">' + esc(d.name) + "</span>" +

  }

  /* ---------- rendering: case file ---------- */
  /* What a mark on an issue locks in: "As implemented" the row marked (implemented) in its options table, "Change"
     the option the note names ("Option B: ..."), picked with the option buttons or written by hand. */
  const PICKED_NOTE = /^\s*Option ([A-Z])\b/;
  const OPTION_LINE = /^\s*Option [A-Z]\b[^\n]*\n?/;
  function pickedKey(it, st) {
    if (st.d === "ok") return it.implemented || "";
    if (st.d === "change") { const m = PICKED_NOTE.exec(st.note || ""); return m ? m[1] : ""; }
    return "";
  }
  function optName(it, key) { const o = (it.options || []).find((x) => x.key === key); return o ? o.nameHtml : ""; }
  function plainText(html) { const t = document.createElement("div"); t.innerHTML = html; return t.textContent.trim(); }
  /* An issue's mark buttons: "As implemented (A)", "Change to:" with a button per other option of the table (it
     starts the note with "Option <key>: <name>.") and "other" (the note says what), "Discuss". With one other
     option, a single "Change to B" button. */
  function itemSegHtml(it, st, ro) {
    const pick = pickedKey(it, st);
    const attrs = (v, pressed, title) => ' data-n="' + it.n + '" data-v="' + v + '"' + ro + ' aria-pressed="' + pressed + '"' + (title ? ' title="' + esc(title) + '"' : "");
    let h = '<button class="opt" data-act="item"' + attrs("ok", st.d === "ok", it.implemented ? plainText(optName(it, it.implemented)) : "the definition as it is now") + ">As implemented" +
      (it.implemented ? " (" + esc(it.implemented) + ")" : "") + "</button>";
    const others = (it.options || []).filter((o) => o.key !== it.implemented);
    if (others.length === 1) {
      // One other option: a single button changes to it.
      const o = others[0];
      h += '<button class="opt" data-act="pickopt" data-k="' + esc(o.key) + '"' + attrs("change", st.d === "change", plainText(o.nameHtml)) + ">Change to " + esc(o.key) + "</button>";
    } else if (others.length) {
      h += '<span class="optgroup" role="group" aria-label="Change to"><span class="glabel">Change to:</span>' +
        others.map((o) => '<button class="opt" data-act="pickopt" data-k="' + esc(o.key) + '"' + attrs("change", st.d === "change" && pick === o.key, plainText(o.nameHtml)) + ">" + esc(o.key) + "</button>").join("") +
        '<button class="opt" data-act="item"' + attrs("change", st.d === "change" && !pick, "a change your note describes") + ">other</button></span>";
    } else {

  /* Highlight the options-table row the mark locks in, dim the others; called on render and on every mark or note. */
  function markOptions(li, it, st) {

        if (tag) {

  function setItemNote(n, it, note) {

  }
  function refreshItem(n) {
    const d = byName.get(ui.current);
    const it = d && d.items.find((x) => String(x.n) === String(n));
    const li = document.getElementById("item-" + n);
    if (!it || !li) return;
    const st0 = (rev(ui.current).items || {})[n] || {};
    const st = shownSt(it, st0);
    const seg = li.querySelector(".seg");
    if (seg) seg.innerHTML = itemSegHtml(it, st, mode === "readonly" ? " disabled" : "");
    const h4 = li.querySelector("h4");
    let pill = h4.querySelector(".statepill");
    const text = itemPill(it, st);

    else {

      pill.dataset.v = st.d; pill.textContent = text;

  function segHtml(opts, current, act, extra, recommended) {

      (recommended === v ? '<span class="rec">rec.</span>' : "") + "</button>").join("");
  }
  function caseLinks(d) {
    const wc = WC + d.folder + "/";
    const recPath = "curation/records/" + d.name + ".md";
    const a = (href, label) => '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + label + "</a>";
    const out = [];
    if (d.folder && d.retired && d.retiredCommit) {
      // The folder is gone from the working copy: link the commit that still holds it.

      if (d.meta) out.push(a(at + wc + "README.md", "README on GitHub" + tag));

  }
  // The declared metric (metrics.md, MET-11): origin, name, original, reference, reason, and the scoring columns.
  const METRIC_ORIGIN = {
    source: "the source's metric",
    stand_in: "a stand-in for the source's metric, which cannot be computed",
    fallback: "the default for the problem type: the source defines no unique metric",
  };
  function metricHtml(d) {
    if (!d.metricMark) return "";
    const m = d.metric;
    if (!m) return d.folder ? '<p class="missing-note">No metric: the definition declares none and its README names none.</p>' : "";
    const link = (v) => /^https?:\/\//.test(v) ? '<a href="' + esc(v) + '" target="_blank" rel="noopener">' + esc(v) + "</a>" : escCode(v);
    const json = (v) => "<code>" + esc(JSON.stringify(v)) + "</code>";
    const rows = [
      ["Metric", "<code>" + esc(m.name) + "</code>"],
      ["Origin", m.origin ? esc(m.origin) + (METRIC_ORIGIN[m.origin] ? ": " + esc(METRIC_ORIGIN[m.origin]) : "") : ""],
      ["Original", m.original ? escCode(m.original) : ""],
      ["Reference", m.reference ? link(m.reference) : ""],
      ["Definition", m.definition ? escCode(m.definition) : ""],
      ["Reason", m.reason ? escCode(m.reason) : ""],
      ["Params", m.params && Object.keys(m.params).length ? json(m.params) : ""],
      ["Inputs", m.inputs && Object.keys(m.inputs).length ? Object.entries(m.inputs).map(([r, c]) => esc(r) + ": <code>" + esc(c) + "</code>").join(", ") : ""],
      ["Scoring columns", (m.scoring_columns || []).map((c) => "<code>" + esc(c.column) + "</code>" +
        (c.role ? " (" + esc(c.role) + (c.description ? ": " + esc(c.description) : "") + ")" : "")).join("; ")],
    ].filter(([, v]) => v);

        }
      });
      d.fields.forEach((f) => { const v = r.fields && r.fields[f.key]; if (v) marks.push("- Field " + f.field + " (record " + f.record + ", definition " + f.definition + "): " + OPT_LABEL[v]); });
      const mt = r.metric;
      if (mt && (mt.d || (mt.note || "").trim())) marks.push("- Metric (" + (d.metric ? d.metric.name : "none") + "): " + (mt.d ? METRIC_LABEL[mt.d] : "no mark") + ((mt.note || "").trim() ? ". Note: " + mt.note.trim() : ""));
      const v = verdictOf(d);
      if (!v && !(r.note || "").trim() && !marks.length) return;
      const vl = v ? labelsFor(d)[v] + (r.verdict ? "" : " (no issues)") : "no verdict";
      lines.push("## " + d.name + ": " + vl);
      if ((r.note || "").trim()) lines.push("Note: " + r.note.trim());
      lines.push(...marks, "");
    });
    const xs = [];
    XITEMS.forEach((it, id) => {
      const st = S.crosscut[id];
      if (st && (st.d || (st.note || "").trim())) {
        const t = document.createElement("div"); t.innerHTML = it.titleHtml;
        xs.push("- " + it.section + " / " + t.textContent + ": " + (st.d ? X_LABEL[st.d] : "no mark") + ((st.note || "").trim() ? ". Note: " + st.note.trim() : ""));
      }
    });
    if (xs.length) lines.push("## Across datasets", ...xs, "");
    return lines.join("\n");
  }
  // Every review and cross-dataset mark in the store's shape (collections reviews and crosscut, by document id),
  // for a reviewer whose marks live only in this browser.
  function decisionsJson() {
    const out = { page: { title: DATA.title, report: DATA.report.path, snapshot: DATA.snapshot }, reviews: {}, crosscut: {} };
    const hasText = (v) => typeof v === "string" && v.trim() !== "";
    Object.keys(S.reviews).sort().forEach((name) => {
      if (!byName.has(name)) return;
      const doc = cleanDoc(S.reviews[name]);
      if (doc.verdict || hasText(doc.note) || doc.metric || Object.keys(doc.items || {}).length || Object.keys(doc.fields || {}).length) out.reviews[name] = doc;
    });
    XITEMS.forEach((_, id) => {
      const doc = S.crosscut[id] && cleanDoc(S.crosscut[id]);
      if (doc && (doc.d || hasText(doc.note))) out.crosscut[id] = doc;
    });
    return JSON.stringify(out, null, 2);
  }
  function renderSummary() {
    const el = document.getElementById("view-summary");
    const tally = { ship: 0, changes: 0, dont: 0, discuss: 0, correct: 0, none: 0 };
    let agree = 0, decided = 0;
    DS.forEach((d) => {
      let v = verdictOf(d);
      if (!v) { tally.none++; return; }
      if (d.cat === "decided" && v === "dont") v = "correct";
      tally[v] = (tally[v] || 0) + 1; decided++;
      if (v === REC[d.cat]) agree++;
    });
    const where = mode === "local"
      ? "Your marks are kept in this browser only: copy them as JSON (below) and hand them to Claude."
      : "Claude reads the decisions from this page’s shared store; the text and the JSON below are the same content for pasting elsewhere.";
    let h = '<div class="page"><h2>Summary</h2><p class="lede">Every record with its recommendation and your verdict. ' + where + "</p>";
    h += '<div class="stats">' +
      '<div class="stat ship"><div class="k">Ship / add</div><div class="v">' + tally.ship + "</div></div>" +
      '<div class="stat changes"><div class="k">Ship after changes</div><div class="v">' + tally.changes + "</div></div>" +
      '<div class="stat dont"><div class="k">Don’t ship / leave out</div><div class="v">' + tally.dont + "</div></div>" +
      '<div class="stat discuss"><div class="k">Discuss</div><div class="v">' + tally.discuss + "</div></div>" +
      '<div class="stat"><div class="k">Triage verified</div><div class="v">' + tally.correct + "</div></div>" +
      '<div class="stat"><div class="k">No verdict yet</div><div class="v">' + tally.none + "</div></div>" +
      '<div class="stat"><div class="k">Agree with rec.</div><div class="v">' + agree + "/" + decided + "</div></div></div>";
    h += '<div class="sumwrap"><table class="sumtab"><thead><tr><th>Record</th><th>Priority</th><th>Category</th><th>Use case fit</th><th>Recommendation</th><th>Your verdict</th><th>Marks</th><th>Note</th></tr></thead><tbody>';
    DS.forEach((d) => {
      const r = peekRev(d.name), c = counts(d);
      const labels = labelsFor(d);
      const f = fitOf(d);
      h += '<tr><td class="name"><button data-act="open" data-name="' + esc(d.name) + '">' + esc(d.name) + "</button></td>" +
        '<td class="num">' + (d.priority || "–") + "</td>" +
        '<td><span class="tag ' + d.cat + '">' + esc(CAT[d.cat]) + "</span></td>" +
        "<td>" + (f ? '<span class="pill ' + f + '">' + esc(FIT[f]) + "</span>" : '<span class="vlabel none">–</span>') + "</td>" +
        "<td>" + esc(labels[REC[d.cat]]) + "</td>" +
        "<td>" + (verdictOf(d) ? '<span class="vlabel" data-v="' + esc(verdictOf(d)) + '">' + esc(labels[verdictOf(d)]) + (r.verdict ? "" : " (no issues)") + "</span>" : '<span class="vlabel none">–</span>') + "</td>" +
        '<td class="num">' + markCount(d, c, r) + "</td>" +
        "<td>" + esc((r.note || "").trim().slice(0, 140)) + ((r.note || "").trim().length > 140 ? "…" : "") + "</td></tr>";
    });
    h += "</tbody></table></div>";
    h += '<div class="actions"><button class="btn" data-act="copy">Copy decisions as text</button>' +
      '<button class="btn ghost" data-act="copyjson">Copy decisions (JSON)</button><span id="copyMsg" class="rowmeta" role="status"></span></div>';
    h += '<p class="intro">Opened as a local file, this page keeps the marks in this browser only; “Copy decisions (JSON)” copies every verdict, mark and note, for Claude to read.</p>';
    h += '<label class="visually-hidden" for="jsonOut">Decisions as JSON</label><textarea class="copyout" id="jsonOut" readonly hidden></textarea>';
    h += '<label class="visually-hidden" for="copyOut">Decisions as text</label><textarea class="copyout" id="copyOut" readonly></textarea>';
    h += '<details class="about"><summary>About this run (from ' + esc(DATA.report.name) + ')</summary><div class="md">' + DATA.headerHtml + "</div></details>";
    h += "</div>";
    el.innerHTML = h;
    document.getElementById("copyOut").value = decisionsText();
    finishMarkdown(el);
  }

  /* ---------- view switching ---------- */
  function showView(v) {
    ui.view = v;
    ["datasets", "across", "summary"].forEach((k) => {
      document.getElementById("view-" + k).hidden = k !== v;
      document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === v));
    });
    if (v === "across") renderAcross();
    if (v === "summary") renderSummary();
    setHash(v === "datasets" ? ui.current : v);
  }
  function setHash(token) { try { history.replaceState(null, "", "#" + token); } catch (e) { /* ignore */ } }
  function select(name, openDetail) {
    if (!byName.has(name)) return;
    // Every record opens on its use case; a reload keeps the tab of the record it restores.
    if (name !== ui.current && ui.ctab !== "usecase") { ui.ctab = "usecase"; store("ctab", "usecase"); }
    ui.current = name;
    store("current", name);
    if (openDetail) ui.detailOpen = true;
    document.getElementById("desk").classList.toggle("detail-open", ui.detailOpen);
    renderList();
    renderCase();
    setHash(name);
    const top = document.getElementById("case");
    if (window.matchMedia("(max-width: 860px)").matches) window.scrollTo(0, 0);
    else if (top.getBoundingClientRect().top < 0) window.scrollTo(0, top.offsetTop - document.getElementById("top").offsetHeight);
    const row = document.querySelector('.rowbtn[aria-current="true"]');
    if (row && row.scrollIntoView) row.scrollIntoView({ block: "nearest" });
  }
  function refreshAll() {
    renderProgress();
    renderList();
    if (ui.view === "summary") renderSummary();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act], [data-tab]");
    if (!b) return;
    if (b.dataset.tab) { showView(b.dataset.tab); return; }
    const act = b.dataset.act;
    const name = ui.current;
    if (act === "sel") { select(b.dataset.name, true); return; }
    if (act === "open") { showView("datasets"); select(b.dataset.name, true); return; }
    if (act === "filter") { ui.filter = b.dataset.f; store("filter", ui.filter); renderFilters(); renderList(); return; }
    if (act === "back") { ui.detailOpen = false; document.getElementById("desk").classList.remove("detail-open"); window.scrollTo(0, 0); return; }
    if (act === "ctab") { showCtab(b.dataset.c); return; }
    if (act === "fn") {
      const box = b.closest(".md");
      const fn = box && Array.from(box.children).find((c) => c.matches("details.fnotes"));
      if (!fn) return;
      box.classList.remove("clamp");
      fn.open = true;
      fn.querySelectorAll("li.flash").forEach((li) => li.classList.remove("flash"));
      const li = fn.querySelector('li[data-fn="' + b.dataset.fn + '"]');
      if (li) { li.classList.add("flash"); li.scrollIntoView({ block: "nearest" }); }
      return;
    }
    if (act === "openpanel") { showCtab("panel"); const t = document.getElementById("ct-panel"); if (t) t.scrollIntoView({ block: "start" }); return; }
    if (act === "toggleResolved") {
      ui.showResolved = !ui.showResolved;
      const y = window.scrollY;
      if (ui.view === "across") renderAcross(); else renderCase();
      window.scrollTo(0, y);
      return;
    }
    if (act === "jump") { const v = document.getElementById("decide"); if (v) v.scrollIntoView({ block: "start" }); return; }
    if (act === "jumpto") { const t = document.getElementById(b.dataset.to); if (t) t.scrollIntoView({ block: "start" }); return; }
    if (act === "copycode") {
      const d = byName.get(name);
      const msg = document.getElementById("codeMsg");
      try {
        navigator.clipboard.writeText(d.code).then(() => { msg.textContent = "Copied."; }, () => { msg.textContent = "Copy failed: select the code instead."; });
      } catch (e) { msg.textContent = "Copy failed: select the code instead."; }
      return;
    }
    if (act === "more") {
      const body = b.previousElementSibling;
      const clamped = body.classList.toggle("clamp");
      b.textContent = clamped ? "Show all" : "Show less";
      return;
    }
    if (act === "prev" || act === "next") {
      const i = DS.findIndex((x) => x.name === name) + (act === "next" ? 1 : -1);
      if (DS[i]) select(DS[i].name, true);
      return;
    }
    if (act === "nextopen") {
      const i = DS.findIndex((x) => x.name === name);
      const order = DS.slice(i + 1).concat(DS.slice(0, i));
      const n = order.find((x) => !peekRev(x.name).verdict);
      if (n) select(n.name, true);
      return;
    }
    if (act === "copyjson") {
      const out = document.getElementById("jsonOut");
      out.value = decisionsJson();
      const msg = document.getElementById("copyMsg");
      const fallback = () => { out.hidden = false; out.focus(); out.select(); msg.textContent = "Selected: press Ctrl+C (or ⌘C) to copy."; };
      try {
        navigator.clipboard.writeText(out.value).then(() => { msg.textContent = "Copied the decisions as JSON."; }, fallback);
      } catch (e) { fallback(); }
      return;
    }
    if (act === "copy") {
      const out = document.getElementById("copyOut");
      out.value = decisionsText();
      const msg = document.getElementById("copyMsg");
      const fallback = () => { out.focus(); out.select(); msg.textContent = "Selected: press Ctrl+C (or ⌘C) to copy."; };
      try {
        navigator.clipboard.writeText(out.value).then(() => { msg.textContent = "Copied."; }, fallback);
      } catch (e) { fallback(); }
      return;
    }
    if (mode === "readonly") return;
    if (act === "verdict") {
      const r = rev(name);
      r.verdict = r.verdict === b.dataset.v ? null : b.dataset.v;
      const dd = byName.get(name);
      touch("reviews", name);
      b.parentElement.querySelectorAll(".opt").forEach((o) => o.setAttribute("aria-pressed", String(o.dataset.v === (r.verdict || (dd && shipsByDefault(dd) ? "ship" : null)))));
      refreshAll();
      return;
    }
    if (act === "item") {
      const r = rev(name);
      const n = b.dataset.n;
      const it = r.items[n] || (r.items[n] = {});
      const item = byName.get(name).items.find((x) => String(x.n) === String(n));
      const reply = item && pending(item, it); // a mark in reply to Claude's last turn sets it, never clears it
      const picked = !reply && it.d === "change" && PICKED_NOTE.test(it.note || "");
      // "other" after a picked option keeps Change and frees the note; a pressed button again clears the mark.
      it.d = it.d === b.dataset.v && !picked && !reply ? null : b.dataset.v;
      if (picked || (reply && b.dataset.v === "change" && PICKED_NOTE.test(it.note || ""))) setItemNote(n, it, (it.note || "").replace(OPTION_LINE, ""));
      if (item && awaitsCurator(item)) it.re = item.askId;
      touch("reviews", name);
      refreshItem(n);
      updateCount();
      refreshAll();
      return;
    }
    if (act === "reply") {
      // An answer to the AI's last turn: the reply line leads the note; the earlier mark stands (Discuss if none).
      const r = rev(name);
      const n = b.dataset.n, k = b.dataset.k;
      const item = byName.get(name).items.find((x) => String(x.n) === String(n));
      const st = r.items[n] || (r.items[n] = {});
      const rest = (st.note || "").replace(REPLY_LINE, "");
      let line;
      if (k === "agree") line = "Agree.";
      else if (k === "disagree") line = "Disagree: ";
      else {
        const c = (item.thread[item.thread.length - 1].choices || []).find((x) => x.key === k);
        const t = plainText(c ? c.html : "");
        line = "Reply (" + k + "): " + (t.length > 110 ? t.slice(0, 109) + "\u2026" : t);
      }
      setItemNote(n, st, line + (rest.trim() ? "\n" + rest : ""));
      if (!st.d) st.d = "discuss";
      st.re = item.askId;
      touch("reviews", name);
      refreshItem(n);
      updateCount();
      refreshAll();
      if (k === "disagree") { const ta = document.querySelector("#item-" + n + " textarea.note"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
      return;
    }
    if (act === "pickopt") {
      // Change to one option of the table: the mark is Change, the note starts with "Option <key>: <name>."; the same
      // button again clears the mark.
      const r = rev(name);
      const n = b.dataset.n, k = b.dataset.k;
      const item = byName.get(name).items.find((x) => String(x.n) === String(n));
      const it = r.items[n] || (r.items[n] = {});
      const rest = (it.note || "").replace(OPTION_LINE, "");
      const reply = pending(item, it);
      if (awaitsCurator(item)) it.re = item.askId;
      if (!reply && it.d === "change" && pickedKey(item, it) === k) {
        it.d = null;
        setItemNote(n, it, rest);
      } else {
        const line = "Option " + k + ": " + plainText(optName(item, k)) + ".";
        it.d = "change";
        setItemNote(n, it, rest.trim() ? line + "\n" + rest : line);
      }
      touch("reviews", name);
      refreshItem(n);
      updateCount();
      refreshAll();
      return;
    }
    if (act === "metric") {
      const r = rev(name);
      const mt = r.metric || (r.metric = {});
      mt.d = mt.d === b.dataset.v ? null : b.dataset.v;
      touch("reviews", name);
      updatePill(b, mt.d, METRIC_LABEL);
      updateCount();
      refreshAll();
      return;
    }
    if (act === "field") {
      const r = rev(name);
      const k = b.dataset.k;
      r.fields[k] = r.fields[k] === b.dataset.v ? null : b.dataset.v;
      touch("reviews", name);
      b.parentElement.querySelectorAll(".opt").forEach((o) => o.setAttribute("aria-pressed", String(o.dataset.v === r.fields[k])));
      const row = b.closest("tr");
      if (r.fields[k]) row.dataset.v = r.fields[k]; else delete row.dataset.v;
      updateCount();
      refreshAll();
      return;
    }
    if (act === "x") {
      const id = b.dataset.id;
      const st = xdoc(id);
      st.d = st.d === b.dataset.v ? null : b.dataset.v;
      touch("crosscut", id);
      updatePill(b, st.d, X_LABEL);
      renderProgress();
    }
  });
  function updatePill(btn, v, labels) {
    const item = btn.closest(".item");
    btn.parentElement.querySelectorAll(".opt").forEach((o) => o.setAttribute("aria-pressed", String(o.dataset.v === v)));
    const h4 = item.querySelector("h4");
    let pill = h4.querySelector(".statepill");
    if (!v) { if (pill) pill.remove(); return; }
    if (!pill) { pill = document.createElement("span"); pill.className = "statepill"; h4.appendChild(pill); }
    pill.dataset.v = v; pill.textContent = labels[v];
  }
  function updateCount() {
    const d = byName.get(ui.current);
    const c = counts(d);
    const el = document.getElementById("decCount");
    if (el) el.textContent = c.done + "/" + c.total;
  }
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.id === "search") { ui.q = t.value.trim(); renderList(); return; }
    if (t.id === "hideReviewed") return;
    if (!t.dataset || !t.dataset.note) return;
    if (!t.classList.contains("big")) autoGrow(t);
    if (mode === "readonly") return;
    const kind = t.dataset.note;
    if (kind === "verdict") { rev(ui.current).note = t.value; touch("reviews", ui.current, true); }
    else if (kind === "item") {
      const r = rev(ui.current); const n = t.dataset.n; const st = r.items[n] || (r.items[n] = {});
      st.note = t.value;
      const item = byName.get(ui.current).items.find((x) => String(x.n) === String(n));
      if (item && awaitsCurator(item) && t.value.trim()) st.re = item.askId; // a written reply answers Claude's turn
      touch("reviews", ui.current, true); refreshItem(n); updateCount(); refreshAll();
    }
    else if (kind === "metric") { const r = rev(ui.current); (r.metric || (r.metric = {})).note = t.value; touch("reviews", ui.current, true); }
    else if (kind === "x") { xdoc(t.dataset.id).note = t.value; touch("crosscut", t.dataset.id, true); }
  });
  document.addEventListener("change", (ev) => {
    if (ev.target.id === "hideReviewed") { ui.hideReviewed = ev.target.checked; store("hideReviewed", ui.hideReviewed); renderList(); }
  });
  document.addEventListener("focusout", (ev) => {
    if (ev.target.dataset && ev.target.dataset.note && dirty.size) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 50); }
    if (ev.target.dataset && ev.target.dataset.note === "verdict") refreshAll();
  });

  /* ---------- remote state ---------- */
  function caseIsBusy() {
    const a = document.activeElement;
    return a && a.closest && (a.closest("#case") || a.closest("#view-across")) && a.tagName === "TEXTAREA";
  }
  function applyRemote(coll, snap) {
    const changed = new Set();
    snap.docChanges().forEach((ch) => {
      const id = ch.doc.id;
      const path = coll + "/" + id;
      if (dirty.has(path) || inflight.has(path)) return;
      if (ch.type === "removed") { delete S[coll][id]; changed.add(id); return; }
      const next = JSON.parse(JSON.stringify(ch.doc.data() || {}));
      if (coll === "reviews") { next.items = next.items || {}; next.fields = next.fields || {}; }
      const prev = S[coll][id];
      if (stable(cleanDoc(prev || {})) !== stable(cleanDoc(next))) { S[coll][id] = next; changed.add(id); }
    });
    if (!changed.size) return;
    renderProgress();
    renderList();
    if (coll === "reviews" && changed.has(ui.current) && !caseIsBusy()) {
      const y = window.scrollY; renderCase(); window.scrollTo(0, y);
    }
    if (coll === "crosscut" && ui.view === "across" && !caseIsBusy()) { const y = window.scrollY; renderAcross(); window.scrollTo(0, y); }
    if (ui.view === "summary") renderSummary();
  }
  function loadLocal() {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith("ndr-doc:")) continue;
        const [coll, id] = k.slice(8).split("/");
        const v = JSON.parse(localStorage.getItem(k));
        if (coll === "reviews" && byName.has(id)) { v.items = v.items || {}; v.fields = v.fields || {}; S.reviews[id] = v; }
        if (coll === "crosscut" && XITEMS.has(id)) S.crosscut[id] = v;
      }
    } catch (e) { /* ignore */ }
  }
  async function connect() {
    let ns = null;
    try { ns = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { ns = null; }
    if (!ns) {
      mode = "local";
      loadLocal();
      banner("The shared review store is not available here, so your marks are kept in this browser only. When you are done, copy them from the Summary view (Copy decisions (JSON)) and hand them to Claude.");
      modeStatus(); renderProgress(); renderList(); renderCase();
      if (ui.view === "across") renderAcross();
      if (dirty.size) flush();
      return;
    }
    db = ns;
    let canWrite = null;
    try {
      const u = await window.claude.use("user");
      if (u) { userId = await u.id(); canWrite = await u.can("data.write"); }
    } catch (e) { /* ignore */ }
    mode = canWrite === false ? "readonly" : "shared";
    if (mode === "readonly") banner("You can read this review, but your access does not allow saving marks.");
    modeStatus();
    ["reviews", "crosscut"].forEach((coll) => {
      db.collection(coll).onSnapshot((snap) => applyRemote(coll, snap), (err) => {
        setStatus("error", "Lost the connection to the shared review");
        if (err && err.code !== "revoked") banner("Live updates stopped. Reload the page to reconnect; marks made since may not be saved.");
      });
    });
    if (mode === "readonly") { renderCase(); if (ui.view === "across") renderAcross(); }
    if (dirty.size) flush();
  }

  /* ---------- start ---------- */
  setHdr();
  renderFilters();
  renderProgress();
  renderList();
  renderCase();
  const h = (location.hash || "").slice(1);
  if (h === "across" || h === "summary") showView(h);
  else if (h && byName.has(h)) { select(h, true); }
  else if (!DS.length) showView("across");
  connect();
})();
</script>
